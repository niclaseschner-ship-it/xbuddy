<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XBuddy App-Panel">
<meta name="theme-color" content="#47503C">
<title>XBuddy · App-Panel</title>
<!-- E-PANEL-6 / DTOK-3 — Token-Strang referenzieren, nicht kopieren.
     ROU-30 serviert die Datei same-origin. CDN-Schrift fällt auf --font-sans zurück. -->
<!-- PANEL-14: ?v=__BUILD_ID__ wird vom Router (render_app_panel_index, PANEL-2-Seam)
     beim Ausliefern ersetzt — Cache-Bust ohne zweite Templating-Schicht. -->
<link rel="stylesheet" href="/display/_shared/design/tokens.css?v=__BUILD_ID__">
<!-- PANEL-10 — installierbar als Vollbild-PWA (PWA-2: Icons + Manifest) -->
<link rel="manifest" href="./manifest.json?v=__BUILD_ID__">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=__BUILD_ID__">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=__BUILD_ID__">
<link rel="apple-touch-icon" href="./icon-192.png?v=__BUILD_ID__">
<link rel="stylesheet" href="./style.css?v=__BUILD_ID__">
</head>
<!-- DTOK-5 / E-PANEL-6: class="xb" data-stage="reader" aktiviert Reader-Stage-Tokens. -->
<!-- PANEL-2 — Panel-Identität liegt als data-panel-id am body und wird vom
     Router beim Ausliefern in den HTML-Body geschrieben. Die Seite kennt
     ihre Identität damit ohne weiteren Roundtrip. -->
<body class="xb" data-stage="reader" data-panel-id="__PANEL_ID__">
  <main id="app">
    <div id="error" class="hidden" role="alert"></div>
    <div id="grid"></div>
  </main>
  <!-- HSP-42 / PANEL-13 — verstecktes Audio-Element für Sticky-Activation-Prime.
       Beim Tap auf eine Kachel startet app.js silent.mp3 als Stille-Loop, damit
       Browser-Sticky-Activation greift und spätere SSE-getriggerte Audio-Quellen-
       Updates ohne weitere User-Geste abspielen können. -->
  <audio id="hsp-audio" preload="auto" style="display:none"></audio>
  <!-- HSP-42 — Tap-Prompt-Overlay als Fallback wenn audio.play() mit
       NotAllowedError rejected. Wird per app.js erstellt/entfernt. -->
  <div id="hsp-tap-prompt" class="hidden" role="button" tabindex="0"
       aria-label="Tippen, um Audio zu starten"
       style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85);
              color:#fff; align-items:center; justify-content:center;
              font-size:1.4rem; z-index:9999; cursor:pointer;">
    Tippen, um Audio zu starten
  </div>
  <!-- INST-1 (#1656) — HSP-Instanz-Liste (nur slugs) server-injiziert aus
       instanzen.json, statt in app.js hartkodiert (Drift-Fix: niclas erscheint).
       Der Server ersetzt __HSP_INSTANZEN_JSON__ durch einen JSON-Array-Blob
       (render_app_panel_index). app.js liest window.__HSP_INSTANZEN__ statt der
       früheren HSP_KIND_IDS-Konstante. -->
  <script>window.__HSP_INSTANZEN__ = __HSP_INSTANZEN_JSON__;</script>
  <!-- PWA-4 — Shared Config-Lader (controller/_shared/config.js) muss vor
       app.js geladen werden, damit pwaShared.loadPwaConfig im Bootstrap
       verfügbar ist. -->
  <script src="/controller/_shared/config.js?v=__BUILD_ID__"></script>
  <script src="./app.js?v=__BUILD_ID__"></script>
</body>
</html>
