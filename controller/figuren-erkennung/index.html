<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Figuren-Erkennung">
<title>XBuddy · Figuren-Erkennung · V1</title>
<style>
  /* FIG-19 — selbsttragend, inline CSS, einzige externe JS-Datei figlib.js im selben Verzeichnis */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --green:  #4ade80;
    --yellow: #facc15;
    --red:    #f87171;
    --dim:    rgba(255,255,255,0.32);
    --line:   rgba(255,255,255,0.08);
  }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b0b10; color: #e8e8ea;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* FIG-15 — Header */
  #header {
    flex: 0 0 auto; padding: 7px 14px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.8px;
    color: rgba(255,255,255,0.62);
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    text-transform: uppercase;
  }
  #header .sep { color: rgba(255,255,255,0.25); margin: 0 6px; }
  #header .sid { color: var(--green); }

  #main { flex: 1 1 auto; position: relative; overflow: hidden; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* FIG-13 — Zielfeld, versteckt während aktiver Session */
  #zielfeld {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 220px; height: 220px;
    border: 2px dashed rgba(255,255,255,0.20);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    font-size: 11px; color: rgba(255,255,255,0.32);
    letter-spacing: 1.2px; text-transform: uppercase;
  }
  #zielfeld.hidden { display: none; }

  /* FIG-8 — Session-Ende-Button im Figur-Schwerpunkt */
  #end-button {
    position: absolute;
    display: none;
    border-radius: 50%;
    background: rgba(248, 113, 113, 0.18);
    border: 2px dashed rgba(248, 113, 113, 0.85);
    color: rgba(248, 113, 113, 1);
    font-size: 12px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    align-items: center; justify-content: center; text-align: center;
    pointer-events: none;  /* Touches gehen über document; figlib entscheidet */
    z-index: 5;
  }
  #end-button.show { display: flex; }

  /* FIG-14 — Roh-Datendarstellung */
  #raw {
    position: absolute; top: 10px; left: 12px;
    font-family: "SF Mono", "Menlo", Consolas, monospace;
    font-size: 10px; color: rgba(127,255,127,0.82);
    line-height: 1.65; pointer-events: none;
    background: rgba(0,0,0,0.45); padding: 6px 10px;
    border-radius: 6px; max-width: 50%;
    white-space: pre;
  }
  #status {
    position: absolute; top: 10px; right: 12px;
    text-align: right; font-size: 11px; color: rgba(255,255,255,0.85);
    line-height: 1.5; pointer-events: none;
    background: rgba(0,0,0,0.45); padding: 6px 10px;
    border-radius: 6px; min-width: 130px;
  }
  #status .fid { font-size: 17px; font-weight: 700; color: var(--dim); }
  #status .fid.ok { color: var(--green); }
  #status .fid.unknown { color: var(--yellow); }
  #status .angle { font-family: "SF Mono", monospace; font-size: 11px; color: rgba(255,255,255,0.65); margin-top: 2px; }
  #status .npts  { font-family: "SF Mono", monospace; font-size: 10px; color: rgba(255,255,255,0.40); }

  /* FIG-16 — Footer */
  #footer {
    flex: 0 0 auto; padding: 6px 14px;
    font-size: 10px; font-family: "SF Mono", monospace;
    color: rgba(255,255,255,0.50);
    border-top: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  #footer .col { flex: 1 1 auto; min-width: 0; }
  #footer .lbl { color: rgba(255,255,255,0.30); font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; display: block; margin-bottom: 1px; }
  #footer .err { color: var(--red); }
  #footer .ok  { color: var(--green); }

  /* FIG-18 — Portrait-Warnung */
  #portrait {
    display: none;
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.93);
    align-items: center; justify-content: center;
    font-size: 16px; color: var(--yellow); text-align: center; padding: 24px;
    letter-spacing: 0.5px;
  }
  @media (orientation: portrait) { #portrait { display: flex; } }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    Figuren-Erkennung<span class="sep">·</span>V1-Test<span class="sep">·</span><span class="sid" id="sid">phone:test-1</span>
  </div>
  <div id="main">
    <canvas id="canvas"></canvas>
    <div id="zielfeld">Figur hier auflegen</div>
    <div id="end-button">Session<br>beenden</div>
    <div id="raw">— keine Punkte —</div>
    <div id="status">
      <div class="fid" id="fid">—</div>
      <div class="angle" id="ang">∠ —</div>
      <div class="npts" id="npts">0 Punkte</div>
    </div>
  </div>
  <div id="footer">
    <div class="col"><span class="lbl">Letzter POST</span><span class="ok" id="last-ok">—</span></div>
    <div class="col"><span class="lbl">Letzter Fehler</span><span class="err" id="last-err">—</span></div>
    <div class="col"><span class="lbl">Events 60 s</span><span id="counts">detected:0 · angle:0 · ended:0</span></div>
  </div>
</div>
<div id="portrait">Bitte ins Querformat drehen.</div>

<script src="./figlib.js"></script>
<script>
(() => {
  'use strict';

  // === FIG-17 — Config aus URL-Parametern (Defaults aus figlib) ===
  const qs = new URLSearchParams(location.search);
  const num = (k, def) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : def; };
  const defaults = figLib.configDefaults();
  const cfg = Object.assign({}, defaults, {
    source_id:                   qs.get('source')  || defaults.source_id,
    router_url:                  qs.get('router')  || '',
    pattern_tolerance:           num('tol',  defaults.pattern_tolerance),
    angle_update_min_delta_deg:  num('dead', defaults.angle_update_min_delta_deg),
    angle_update_max_hz:         num('rate', defaults.angle_update_max_hz),
  });
  document.getElementById('sid').textContent = cfg.source_id;

  // === Session ===
  const session = figLib.createSession(cfg);

  // === Canvas + Resize ===
  const cvs = document.getElementById('canvas');
  const ctx = cvs.getContext('2d');
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = cvs.clientWidth, h = cvs.clientHeight;
    cvs.width = w * dpr; cvs.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // === Touch-Handler ===
  let currentTouches = [];
  function handleTouch(e) {
    e.preventDefault();
    const r = cvs.getBoundingClientRect();
    const touches = [];
    for (let i = 0; i < e.touches.length; i++) {
      const t = e.touches[i];
      touches.push({
        id: t.identifier,
        x: t.clientX - r.left,
        y: t.clientY - r.top,
      });
    }
    currentTouches = touches;
    const events = figLib.feedTouches(session, touches, performance.now());
    for (const ev of events) sendEvent(ev);
    draw();
  }
  for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
    document.addEventListener(ev, handleTouch, { passive: false });
  }

  // === FIG-9 + FIG-12 — Event-Send mit Retry ===
  const counters = { figure_detected: [], angle_update: [], session_ended: [] };
  let lastOkAt = null, lastErrAt = null, lastErrMsg = null;
  const BACKOFFS = [200, 1000, 5000];

  function sendEvent(event) {
    counters[event.type] = counters[event.type] || [];
    counters[event.type].push(performance.now());

    if (!cfg.router_url) {
      console.log('[event]', event);
      lastOkAt = new Date();
      updateFooter();
      return;
    }
    const url = cfg.router_url.replace(/\/+$/, '') + '/event';
    postWithRetry(url, event, 0);
  }
  function postWithRetry(url, body, attempt) {
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      keepalive: true,
    }).then((r) => {
      if (!r.ok) {
        if (r.status >= 500 && attempt < BACKOFFS.length) {
          setTimeout(() => postWithRetry(url, body, attempt + 1), BACKOFFS[attempt]);
        } else {
          recordError(body.type, 'HTTP ' + r.status);
        }
        return;
      }
      lastOkAt = new Date();
      updateFooter();
    }).catch((err) => {
      if (attempt < BACKOFFS.length) {
        setTimeout(() => postWithRetry(url, body, attempt + 1), BACKOFFS[attempt]);
      } else {
        recordError(body.type, err.message || 'network');
      }
    });
  }
  function recordError(type, msg) {
    lastErrAt = new Date();
    lastErrMsg = type + ': ' + msg;
    updateFooter();
  }

  // === Rendering ===
  function draw() {
    const W = cvs.clientWidth, H = cvs.clientHeight;
    ctx.clearRect(0, 0, W, H);

    // Touch-Punkte
    for (const t of currentTouches) {
      ctx.beginPath();
      ctx.arc(t.x, t.y, 22, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(74,222,128,0.15)';
      ctx.fill();
      ctx.strokeStyle = session.figurePresent ? '#4ade80' : 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(t.x, t.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = 'bold 10px -apple-system, system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('#' + t.id, t.x, t.y - 30);
    }

    // Dreieck wenn präsent
    if (session.figurePresent && currentTouches.length >= 3) {
      const three = figLib.pickThree(currentTouches);
      ctx.beginPath();
      ctx.moveTo(three[0].x, three[0].y);
      ctx.lineTo(three[1].x, three[1].y);
      ctx.lineTo(three[2].x, three[2].y);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(74,222,128,0.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Raw-Overlay
    const rawEl = document.getElementById('raw');
    if (currentTouches.length === 0) {
      rawEl.textContent = '— keine Punkte —';
    } else {
      const lines = currentTouches.map(p => `P${p.id}: x=${p.x.toFixed(0)} y=${p.y.toFixed(0)}`);
      if (currentTouches.length >= 3) {
        const three = figLib.pickThree(currentTouches);
        const desc = figLib.descriptor(three[0], three[1], three[2]);
        const c = figLib.centroid(three);
        lines.push(`d    : [${desc[0].toFixed(3)}, ${desc[1].toFixed(3)}, 1.000]`);
        lines.push(`zent : (${c.x.toFixed(0)}, ${c.y.toFixed(0)})`);
        const dlt = (session.lastFrameDelta || 0).toFixed(2);
        const mok = session.lastMatchOk || '—';
        lines.push(`match: ${mok}   Δ: ${dlt}°   cum: ${session.cumulativeAngle.toFixed(1)}°`);
      }
      rawEl.textContent = lines.join('\n');
    }

    // Status-Box
    const fid = document.getElementById('fid');
    const angEl = document.getElementById('ang');
    const npts = document.getElementById('npts');
    npts.textContent = currentTouches.length + ' Punkt' + (currentTouches.length === 1 ? '' : 'e');
    if (session.figurePresent && session.identifiedFigureId) {
      fid.textContent = session.identifiedFigureId;
      fid.className = 'fid ok';
      angEl.textContent = '∠ ' + session.cumulativeAngle.toFixed(1) + '°';
    } else if (session.figurePresent) {
      fid.textContent = '— unbekannt —';
      fid.className = 'fid unknown';
      angEl.textContent = '∠ —';
    } else {
      fid.textContent = '—';
      fid.className = 'fid';
      angEl.textContent = '∠ —';
    }

    // FIG-8 — Session-Ende-Button
    const btn = document.getElementById('end-button');
    if (session.figurePresent && session.buttonCircle) {
      const c = session.buttonCircle;
      btn.style.left   = (c.x - c.r) + 'px';
      btn.style.top    = (c.y - c.r) + 'px';
      btn.style.width  = (c.r * 2) + 'px';
      btn.style.height = (c.r * 2) + 'px';
      btn.classList.add('show');
    } else {
      btn.classList.remove('show');
    }

    // FIG-13 — Zielfeld versteckt wenn Session aktiv
    document.getElementById('zielfeld').classList.toggle('hidden', session.figurePresent);
  }

  // === Footer (FIG-16) ===
  function fmtTime(d) {
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    const s = String(d.getSeconds()).padStart(2, '0');
    return h + ':' + m + ':' + s;
  }
  function updateFooter() {
    document.getElementById('last-ok').textContent  = lastOkAt  ? fmtTime(lastOkAt)  : '—';
    document.getElementById('last-err').textContent = lastErrAt ? (fmtTime(lastErrAt) + ' · ' + lastErrMsg) : '—';
    const cutoff = performance.now() - 60_000;
    for (const k of Object.keys(counters)) counters[k] = counters[k].filter(t => t >= cutoff);
    document.getElementById('counts').textContent =
      `detected:${counters.figure_detected.length} · ` +
      `angle:${counters.angle_update.length} · ` +
      `ended:${counters.session_ended.length}`;
  }
  setInterval(updateFooter, 1000);

  // === Periodischer Tick (50 ms) — treibt FIG-2-Eintritts-Hysterese und
  //     FIG-8-Button-Dwell auch ohne neue Touch-Events. Beim Realtest
  //     2026-05-20 hat sich gezeigt: ohne Tick wird eine ruhig liegende
  //     Figur erst beim nächsten touchmove als präsent erkannt. ===
  setInterval(() => {
    if (currentTouches.length === 0 && !session.figurePresent) return;
    const events = figLib.feedTouches(session, currentTouches, performance.now());
    for (const ev of events) sendEvent(ev);
    draw();
  }, 50);

  // === Init ===
  resize();
  draw();
  updateFooter();
})();
</script>
</body>
</html>
