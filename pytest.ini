[pytest]
# Repo-weiter pytest-Lauf (#52).
#
# Hintergrund: Die Komponenten router/, familie/ und eltern-chat/ haben je ein
# main.py. Beim repo-weiten Lauf sammelte pytest diese gleichnamigen,
# paketlosen Module unter demselben Kurznamen `main` in sys.modules ein — das
# zuletzt importierte gewann, Tests sahen das falsche Modul. Jede Suite
# EINZELN lief grün, der Gesamtlauf rot.
#
# Lösung (#52) — reine Test- und Import-Hygiene, kein Verhaltens-Code:
#  - router/ und familie/ sind echte Pakete (__init__.py) — analog plan/ und
#    zugangsdaten/. Ihre Tests importieren über den Paketpfad
#    (`from router import main`, `from familie import main`/`registry`), womit
#    die main-Module eindeutige Namen tragen (router.main, familie.main).
#  - eltern-chat/main.py ist damit das einzige verbleibende top-level `main`
#    und kollidiert nicht mehr. (eltern-chat/ kann wegen des Bindestrichs im
#    Namen kein importierbares Paket sein und bleibt deshalb paketlos.)
#  - Die Test-Helfer der Eltern-Chat-Suite lagen in tests/conftest.py, obwohl
#    sie keine Fixtures sind, sondern per `from conftest import` direkt
#    importiert wurden. Bei zwei conftest.py-Dateien im Repo ist `conftest`
#    als bare Importname mehrdeutig. Die Helfer liegen jetzt in der eindeutig
#    benannten tests/fakes.py; conftest.py bleibt nur dort, wo es echte
#    Fixtures gibt (plan/tests/).
testpaths =
    router/tests
    familie/tests
    geraete/tests
    eltern-chat/tests
    plan/tests
    zugangsdaten/tests
    tools/ca/tests
    deploy/nginx/tests
    controller/app-panel/tests
    tests/tools
