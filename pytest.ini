[pytest]
# Repo-weiter pytest-Lauf (#52).
#
# Hintergrund: Die Komponenten familie/ und eltern-chat/ haben je ein
# main.py (früher auch router/, mit RAT-31/#1568 abgerissen). Beim repo-weiten
# Lauf sammelte pytest diese gleichnamigen,
# paketlosen Module unter demselben Kurznamen `main` in sys.modules ein — das
# zuletzt importierte gewann, Tests sahen das falsche Modul. Jede Suite
# EINZELN lief grün, der Gesamtlauf rot.
#
# Lösung (#52) — reine Test- und Import-Hygiene, kein Verhaltens-Code:
#  - familie/ ist ein echtes Paket (__init__.py) — analog plan/.
#    Seine Tests importieren über den Paketpfad (`from familie import main`/
#    `registry`), womit die main-Module eindeutige
#    Namen tragen (familie.main). zugangsdaten lebt seit #211 als
#    Library unter tools/zugangsdaten/ — die Tests dort liegen in tests/tools/.
#  - eltern-chat/main.py ist damit das einzige verbleibende top-level `main`
#    und kollidiert nicht mehr. (eltern-chat/ kann wegen des Bindestrichs im
#    Namen kein importierbares Paket sein und bleibt deshalb paketlos.)
#  - Die Test-Helfer der Eltern-Chat-Suite lagen in tests/conftest.py, obwohl
#    sie keine Fixtures sind, sondern per `from conftest import` direkt
#    importiert wurden. Bei zwei conftest.py-Dateien im Repo ist `conftest`
#    als bare Importname mehrdeutig. Die Helfer liegen jetzt in der eindeutig
#    benannten tests/fakes.py; conftest.py bleibt nur dort, wo es echte
#    Fixtures gibt (plan/tests/).
# testpaths listet ALLE realen pytest-Suiten des Repos. Der Guard-Test
# tests/test_testpaths_vollstaendig.py hält diese Liste gegen die Realität:
# er findet jedes Verzeichnis mit test_*.py und meldet, wenn eine Suite hier
# fehlt (Schutz gegen unsichtbar-nicht-gelaufene Tests — T1310). Nicht-pytest-
# Skripte (z. B. methode/hooks/tests) sind dort dokumentiert ausgenommen,
# nicht hier gelistet.
testpaths =
    familie/tests
    eltern-chat/tests
    plan/tests
    wetter/tests
    routine/tests
    photo/tests
    seiten/tests
    kibuddy/tests
    panel/tests
    tools/ca/tests
    tools/tests
    tools/initdata/tests
    tools/llm/tests
    tools/medien_store/tests
    tools/zugangsdaten/tests
    deploy/nginx/tests
    deploy/tests
    deploy/alerting/tests
    controller/app-panel/tests
    tests
    tests/tools
    essen/tests
    hoerspiel/tests
    eltern-chat/tests/skills
