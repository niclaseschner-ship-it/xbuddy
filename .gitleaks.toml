# Leak-Guard — Custom-PII-Ruleset für xbuddy (#1724, Part of #1309 public).
#
# Zweck: verhindert, dass versehentlich Privates (Klarnamen, Familien-Mail,
# Heim-IPs, Tailnet-Identifier, Telegram-Chat-ID) ins Repo — und damit später
# public — gerät. Recycelt das ratifizierte Gate-1-Pattern-Set aus
# dem früheren, inzwischen entfernten Mirror-Skript — die Muster leben heute
# direkt in dieser Datei (KEINE neuen Muster erfunden).
#
# Drei Einsatzpunkte, EIN Ruleset (#1724):
#   1. .pre-commit-config.yaml  → blockt Commit lokal auf dem Pi
#   2. .github/workflows/leak-guard.yml → blockt PR (required erst NACH #1719-Scrub)
#   3. gitleaks detect --no-git  → HEAD-Scan, Leak-Liste für den Clean (#1719)
#
# `useDefault = true`: gitleaks-Standard-Secret-Regeln (AWS/GitHub/…) sind zusätzlich
# aktiv (zweite Schicht neben der Custom-PII-Schicht).

title = "xbuddy Leak-Guard (Custom-PII aus Gate-1, #1724)"

[extend]
useDefault = true

# ── Klarnamen (Familie) ──────────────────────────────────────────────────────
# Wortgrenzen (\b) wie im Gate-1-Set — sonst träfe 'vera' in 'Verantwortung'.
[[rules]]
id = "xbuddy-familienname-eschner"
description = "Familienname Eschner (Klarname)"
regex = '''(?i)\beschner\b'''
# LICENSE ratifiziert ausgenommen — der Copyright-Name bleibt (2026-07-30).
[[rules.allowlists]]
# LICENSE trägt den echten Autor-Namen (by-design, Apache-Copyright); die
# Detektor-Dateien tragen den Namen als Erkennungs-Regex (#1759, kein Leak).
paths = [
    '''(^|/)LICENSE$''',
    '''(^|/)\.gitleaks\.toml$''',
    '''(^|/)\.gitleaks-local\.toml$''',
    '''(^|/)\.gitleaks-local\.example\.toml$''',
]

[[rules]]
id = "xbuddy-vornamen-erwachsene"
description = "Vornamen der Erwachsenen (Klarnamen)"
regex = '''(?i)\b(sophia|julian|vera|taro)\b'''

# Die Kind-Slugs sind seit #1783 im gitignored `.gitleaks-local.toml` — die Regel
# stand hier mit den Slugs im Regex UND in ihrer description, gab also preis, was
# sie schützen soll. Guard bleibt scharf: pre-commit nutzt das Supplement.

[[rules]]
id = "xbuddy-niclas-slug"
description = "Slug niclas (Klarname)"
regex = '''(?i)\bniclas\b'''
# LICENSE ausgenommen wie eschner (Copyright-Name ratifiziert behalten).
[[rules.allowlists]]
# LICENSE trägt den echten Autor-Namen (by-design, Apache-Copyright); die
# Detektor-Dateien tragen den Namen als Erkennungs-Regex (#1759, kein Leak).
paths = [
    '''(^|/)LICENSE$''',
    '''(^|/)\.gitleaks\.toml$''',
    '''(^|/)\.gitleaks-local\.toml$''',
    '''(^|/)\.gitleaks-local\.example\.toml$''',
]

# ── Private Kontaktdaten ─────────────────────────────────────────────────────
[[rules]]
id = "xbuddy-github-org"
# Der Org-Name ist in einem public Repo kein Geheimnis — er steht in der
# Clone-URL jedes Besuchers. Schützenswert ist er nur als HARTKODIERTE Kopplung:
# ein Pfad, ein Remote, ein API-Aufruf, der dieses Konto festschreibt, macht das
# Repo für Fremde unbrauchbar. Als Link in der Doku ist er dagegen die korrekte
# Adresse.
#
# Deshalb die Zeilen-Ausnahme unten statt einer Datei-Liste: eine Datei-Liste
# driftet mit jeder neuen Doku-Seite und macht den Job dauerhaft rot (#1810).
description = "GitHub-Org hartkodiert (außerhalb von Doku-Links)"
regex = '''niclaseschner-ship-it'''
[[rules.allowlists]]
# Ausgenommen ist genau EINE Form: der Markdown-Inline-Link `](https://github.com/…`.
# Das ist die Form, in der die Doku auf public Repos verweist — die korrekte
# Adresse, kein Leak.
#
# Warum nicht `paths = ['\.md$']` plus Zeilen-Regex mit `matchCondition = "AND"`:
# gitleaks 8.21.2 kennt `matchCondition` noch nicht und verknüpft die Kriterien
# mit ODER. Die Ausnahme wäre dann viel zu breit — jede .md-Datei UND jede
# github.com-Zeile im Code wären still. Empirisch mit einer Präzisions-Matrix
# nachgewiesen (#1810). Der Link-Kontext im Muster selbst erreicht das UND ohne
# das Feature.
#
# `regexTarget = "line"` prüft die ganze Zeile, nicht nur den Treffer — der
# Treffer ist ja nur der Org-Name, nie der umgebende Link.
#
# Es bleibt Treffer: dieselbe URL als nackter String im Code, ein
# `git@github.com:`-Remote, und der Org-Name ohne Link auch in Markdown. Genau
# das ist die hartkodierte Kopplung, um die es der Regel geht.
regexTarget = "line"
regexes = [
    '''\]\(https://github\.com/''',
]

[[rules]]
id = "xbuddy-tailscale-fqdn"
description = "Tailscale-FQDN-Identifier (instanz-spezifisch)"
regex = '''taile235cf'''

[[rules]]
id = "xbuddy-lan-ip"
description = "Spezifische Heim-LAN-IP (nicht generische RFC-1918-CIDR)"
regex = '''192\.168\.178\.'''

[[rules]]
id = "xbuddy-tailnet-ip"
description = "Spezifische Tailnet-IP (nicht 100.64.0.0/10 CIDR)"
regex = '''100\.108\.61\.'''

[[rules]]
id = "xbuddy-telegram-chat-id"
description = "Bekannte Telegram-Chat-ID"
regex = '''\b464143432\b'''


# ── Familien-spezifische PII (Wohnort + private Mail) ────────────────────────
# Die Regeln xbuddy-ortsname / xbuddy-private-mail / xbuddy-familien-mail-domain
# leben seit #1759 im gitignored .gitleaks-local.toml (extendet diese Datei).
# Diese public Config bleibt PII-frei; pre-commit auf dem Pi nutzt das Supplement
# und ist damit voll scharf. Format-Vorlage: .gitleaks-local.example.toml.

[[allowlists]]
description = "Ruleset-Selbstreferenz + curated Detektor-/FP-/Artefakt-Ausnahmen (#1719, #1759)"
paths = [
    # Detektor-Dateien selbst (Muster sind Absicht, kein Leak): public Config,
    # das gitignored PII-Supplement und dessen Beispiel-Vorlage (#1759).
    '''(^|/)\.gitleaks\.toml$''',
    '''(^|/)\.gitleaks-local\.toml$''',
    '''(^|/)\.gitleaks-local\.example\.toml$''',
    '''test_auth_decorator_coverage\.py''',
    '''\.pyc$''',
]
