# Leak-Guard — pre-commit-Hook (#1724, Part of #1309 public).
#
# Blockt lokal auf dem Pi einen Commit, der ein Custom-PII-Muster aus
# .gitleaks.toml trägt (Chat-ID, Heim-IP, Tailnet-Identifier, private Mail,
# Klarnamen/Slugs). Erste Verteidigungslinie VOR dem Push.
#
# Einrichten (einmalig, pro Klon):
#   pipx install pre-commit   # oder: uvx pre-commit
#   pre-commit install        # hängt den Hook in .git/hooks/pre-commit
#
# Der Hook liest automatisch die repo-eigene .gitleaks.toml (Custom-Ruleset).
#
# HINWEIS (Übergang bis #1719-Scrub): der Klarnamen-Teil des Rulesets feuert
# noch auf die funktionalen Slugs (paula/neko/niclas) im Live-Code — bis #1719
# den Baum auf kind1/kind2/kind3 scrubbt, kann `pre-commit run --all-files`
# darauf anschlagen. Der Hook prüft aber per Default nur die GESTAGEDEN Änderungen
# (nur neu eingeführte Treffer), nicht den ganzen Baum — normale Commits, die
# keine neuen PII-Muster einführen, laufen durch.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (Custom-PII-Ruleset)
