# Leak-Guard — pre-commit-Hook (#1724 / #1783, Part of #1309 public).
#
# Blockt lokal einen Commit, der ein Custom-PII-Muster traegt (Chat-ID, Heim-IP,
# Tailnet-Identifier, private Mail, Klarnamen/Slugs). Erste Verteidigungslinie
# VOR dem Push.
#
# Einrichten (einmalig, pro Klon):
#   uvx pre-commit install          # oder: pipx install pre-commit && pre-commit install
#   cp .gitleaks-local.example.toml .gitleaks-local.toml
#   # dann die <PLATZHALTER> durch die echten Familien-Werte ersetzen
#
# Der Hook laeuft ueber tools/leak-guard/precommit.sh. Der Wrapper existiert,
# weil die scharfe Config gitignored ist und damit nur im Haupt-Klon liegt: er
# findet sie auch aus einem Worktree heraus und faellt sonst sichtbar auf das
# public Ruleset zurueck, statt jeden Commit zu blockieren. Begruendung im
# Skript-Kopf und in docs/leak-guard.md.
#
# Geprueft werden nur die GESTAGEDEN Aenderungen, nicht der ganze Baum — ein
# Commit, der kein neues PII-Muster einfuehrt, laeuft durch.

repos:
  - repo: local
    hooks:
      - id: leak-guard
        name: leak-guard (gitleaks, Custom-PII-Ruleset + lokales Supplement)
        entry: tools/leak-guard/precommit.sh
        language: script
        pass_filenames: false
        always_run: true
