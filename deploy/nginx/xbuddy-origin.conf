# xbuddy-origin.conf — die EINE HTTPS-Origin einer XBuddy-Instanz (#36).
#
# Setzt URL-11 + URL-12 aus specs/platform/urls.md um:
#   URL-11  Alle Endpunkte werden über HTTPS ausgeliefert.
#   URL-12  Eine Origin (gleiches Schema/Host/Port) für alle Endpunkte;
#           welche Komponente bedient, ergibt sich allein aus dem Pfad-Prefix
#           (URL-1) — nicht aus Host oder Port.
#
# nginx terminiert TLS auf Port 8443 mit dem von der lokalen Root-CA
# signierten Server-Zertifikat (tools/ca/make-ca.sh) und reverse-proxyt nach
# Pfad-Prefix an die getrennten Komponenten-Prozesse. Die Komponenten bleiben
# eigenständige Prozesse hinter dem Proxy.
#
# Routing-Tabelle (URL-14, Pfad-Prefix → Upstream-Port):
#   /api/v1/<komp>/admin/           → 404 (Loopback-only, #140 EC-21)
#   /display/_shared/icons/         → statisch aus icon-root (ICONS-5, #135)
#   /display/plan/                  → Plan-Buddy 127.0.0.1:5020 (plan/main.py DEFAULTS)
#   /api/v1/plan/                   → Plan-Buddy 127.0.0.1:5020
#   /api/v1/familie/                → Familie    127.0.0.1:5010 (familie/main.py DEFAULTS, FAM-7/8)
#   /api/v1/geraete/                → Geräte     127.0.0.1:5040 (geraete/main.py DEFAULTS, GER-13/14/15)
#   /api/v1/displays/<id>/events    → Router     127.0.0.1:5000 (SSE, ungepuffert)
#   /display/                       → Router     127.0.0.1:5000 (router/main.py DEFAULTS)
#   /controller/                    → Router     127.0.0.1:5000
#   /api/v1/                        → Router     127.0.0.1:5000
#
# Reihenfolge zählt (URL-14: spezifisch vor allgemein, längster Prefix
# gewinnt): die Buddy-spezifischen Prefixe (/display/plan/, /api/v1/plan/,
# /api/v1/familie/, /api/v1/geraete/) stehen vor den allgemeinen Router-
# Prefixen (/display/, /api/v1/) — nginx-`location` mit Prefix wählt den
# längsten Treffer, hier explizit dokumentiert.
#
# Ausrollen: siehe deploy/nginx/README.md. Die Pi-seitige Anwendung
# (Pfade, systemd, Reload) ist Ops.

# Upstream-Definitionen — die getrennten Komponenten-Prozesse.
upstream xbuddy_router {
    # Router-Prozess (router/main.py) — Default-Port 5000.
    server 127.0.0.1:5000;
}

upstream xbuddy_plan {
    # Plan-Buddy-Prozess (plan/main.py) — Default-Port 5020.
    server 127.0.0.1:5020;
}

upstream xbuddy_familie {
    # Familie-Mit-Host-Prozess (familie/main.py) — Default-Port 5010.
    # Liefert Personen-Lese-API (FAM-7) und Profilfoto-Endpunkt (FAM-8).
    server 127.0.0.1:5010;
}

upstream xbuddy_geraete {
    # Geräte-Registry-Prozess (geraete/main.py) — Default-Port 5040 (PORT-2).
    # Liefert Geräte-Lese-API (GER-13/14) und Schreib-API (GER-15).
    server 127.0.0.1:5040;
}

server {
    # URL-12: EINE Origin. Genau ein listen-Port, ein Server-Zertifikat.
    listen      8443 ssl;
    listen      [::]:8443 ssl;
    server_name xbuddy-hub.local localhost;

    # URL-11: HTTPS mit dem CA-signierten Server-Zertifikat.
    # Diese Dateien erzeugt tools/ca/make-ca.sh — Per-Instanz, NICHT im Repo.
    # Pfade sind Platzhalter; beim Ausrollen auf den realen Ablageort der
    # Instanz anpassen (siehe README.md).
    ssl_certificate     /etc/xbuddy/tls/server-cert.pem;
    ssl_certificate_key /etc/xbuddy/tls/server-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy-Header — die Komponenten sehen die echte Origin-Adresse.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --- Admin-Endpoints: Loopback-only, NICHT vom Netz erreichbar ------
    # /api/v1/<komponente>/admin/* — Reload, Healthchecks, Wartungs-Werkzeuge.
    # Der Reload-Endpoint des Routers (#140, EC-21) erwartet 127.0.0.1; nginx
    # ist Defense in Depth und blockiert hier sichtbar an der Origin, damit
    # ein versehentliches „Admin frei ans Internet" nicht passieren kann.
    # Regex-Location hat Vorrang vor Prefix-Locations (URL-14), die Regel
    # greift also vor den /api/v1/-Prefixen weiter unten. 404 statt 403,
    # damit die Existenz von Admin-Endpoints von außen nicht sichtbar wird.
    location ~ ^/api/v1/[^/]+/admin/ {
        return 404;
    }

    # --- Icon-Bibliothek: statisch aus der Per-Instanz-icon-root ---------
    # /display/_shared/icons/arasaac/<id>.png — zentrale, geteilte
    # ARASAAC-Piktogramme (specs/platform/icons.md ICONS-5, #135). Anders
    # als die proxy_pass-Prefixe liefert nginx diesen Pfad direkt als
    # statische Datei aus dem icon-root (ICONS-2) aus — read-only, ohne
    # Komponenten-Prozess, weil es reine Assets ausserhalb jedes
    # Komponenten-Verzeichnisses sind. Muss VOR dem allgemeinen /display/-
    # Block stehen (URL-14: spezifisch vor allgemein), sonst landen
    # Icon-Requests beim Router (5000) statt im Dateisystem.
    #
    # `alias` mappt /display/_shared/icons/ auf die icon-root; das
    # Rest-Segment (arasaac/<id>.png) haengt an. Default-icon-root ist
    # /home/buddy/apps/icons/ (ICONS-2); weicht die Instanz ab, hier den
    # alias-Pfad anpassen — der icon-root ist Per-Instanz-Daten, NICHT im
    # Repo (analog zu den ssl_certificate-Pfaden oben).
    location /display/_shared/icons/ {
        alias /home/buddy/apps/icons/;
        # Nur Lesen: andere Methoden gibt es fuer Assets nicht.
        limit_except GET HEAD { deny all; }
        # Statik: keine Proxy-Header noetig, kein Upstream.
        autoindex off;
    }

    # --- Plan-Buddy: spezifische Prefixe zuerst (URL-1) -----------------
    # /display/plan/* — Display-Views des Plan-Buddys.
    location /display/plan/ {
        proxy_pass http://xbuddy_plan;
    }

    # /api/v1/plan/* — Plan-Buddy-Backend (Termine, Zuteilung, Aktivität).
    location /api/v1/plan/ {
        proxy_pass http://xbuddy_plan;
    }

    # --- Familie: spezifischer Prefix vor /api/v1/ (URL-14, #85) --------
    # /api/v1/familie/* — Familien-Mit-Host (Personen-Liste FAM-7,
    # Profilfotos FAM-8). Muss VOR dem allgemeinen /api/v1/-Block stehen,
    # sonst landen Foto-Requests beim Router (5000) statt bei Familie
    # (5010) — siehe Plan-Buddy-Wireframes, die `/api/v1/familie/foto/<id>`
    # einbetten (PLAN-24 → FAM-8). Kein SSE, also keine Spezial-Direktiven.
    location /api/v1/familie/ {
        proxy_pass http://xbuddy_familie;
    }

    # --- Geräte: spezifischer Prefix vor /api/v1/ (URL-14, #212) --------
    # /api/v1/geraete/* — Geräte-Registry (GER-13/14/15). Muss VOR dem
    # allgemeinen /api/v1/-Block stehen, sonst landen Geräte-Requests beim
    # Router (5000) statt bei der Geräte-Registry (5040). Kein SSE, also
    # keine Spezial-Direktiven.
    location /api/v1/geraete/ {
        proxy_pass http://xbuddy_geraete;
    }

    # --- Router: allgemeine Prefixe (URL-1) -----------------------------
    # /display/* — Display-Views (außer plan, oben abgefangen).
    location /display/ {
        proxy_pass http://xbuddy_router;
    }

    # /controller/* — Controller-Aktionen.
    location /controller/ {
        proxy_pass http://xbuddy_router;
    }

    # /api/v1/displays/<id>/events — SSE-Zustands-Stream (ROU-22).
    # Eigene Regex-location, weil dieser Long-Lived-Stream andere
    # Proxy-Einstellungen braucht als die kurzlebigen JSON-Endpunkte:
    # ohne `proxy_buffering off;` hält nginx die Events zurück und das
    # Display empfängt nie Zustand (#70). Regex-locations haben Vorrang
    # vor Prefix-locations — der Treffer ist explizit und chirurgisch,
    # die Prefix-Reihenfolge (/api/v1/plan/ vor /api/v1/) bleibt unberührt.
    location ~ ^/api/v1/displays/[^/]+/events$ {
        proxy_pass http://xbuddy_router;
        # SSE: Stream sofort durchreichen, nicht puffern oder cachen.
        proxy_buffering off;
        proxy_cache off;
        # Verbindung lange offen halten — der Router sendet alle 15 s
        # einen Heartbeat (ROU-22, SSE_HEARTBEAT_SECONDS); 1 h liegt
        # weit darüber, der Stream läuft so unbegrenzt weiter.
        proxy_read_timeout 1h;
    }

    # /api/v1/* — Hub-Backend (State, Events, Diagnose).
    location /api/v1/ {
        proxy_pass http://xbuddy_router;
    }

    # URL-1: andere Top-Level-Pfade sind nicht erlaubt.
    location / {
        return 404;
    }
}
