# xbuddy-origin.conf — die EINE HTTPS-Origin einer XBuddy-Instanz (#36).
#
# Setzt URL-11 + URL-12 aus specs/platform/urls.md um:
#   URL-11  Alle Endpunkte werden über HTTPS ausgeliefert.
#   URL-12  Eine Origin (gleiches Schema/Host/Port) für alle Endpunkte;
#           welche Komponente bedient, ergibt sich allein aus dem Pfad-Prefix
#           (URL-1) — nicht aus Host oder Port.
#
# nginx terminiert TLS auf Port 8443 mit dem von der lokalen Root-CA
# signierten Server-Zertifikat (tools/ca/make-ca.sh) und reverse-proxyt nach
# Pfad-Prefix an die getrennten Komponenten-Prozesse. Die Komponenten bleiben
# eigenständige Prozesse hinter dem Proxy.
#
# Routing-Tabelle (URL-14, Pfad-Prefix → Upstream-Port):
#   /api/v1/<komp>/admin/           → 404 (Loopback-only, URL-17, #140 EC-21)
#   NOTE: /display/_shared/design/, /controller/_shared/, /display/_shared/icons/,
#         /api/v1/icons/suche und /shell/ gehen an Seiten 5042. Eigene Blöcke
#         spezifisch vor /display/ bzw. /controller/ bzw. /api/v1/ (URL-14), aber
#         kein eigener Tabellen-Eintrag mit Pfeil (ALLOWED_DRIFT_IN_NGINX,
#         tests/test_routing_table.py). RAT-31 E6f-A (#1582): design +
#         controller/_shared/. E6f-B (#1586): icons + suche.
#         /shell/ (SHELL-1, heim-shell.md): von PR-D (#1568) versehentlich
#         entfernt, Hotfix #1592.
#   /display/plan/                  → Plan-Buddy    127.0.0.1:5020 (plan/main.py DEFAULTS)
#   /display/wetter/                → Wetter-Buddy  127.0.0.1:5030 (wetter/main.py DEFAULTS)
#   /display/routine/               → Routine-Buddy 127.0.0.1:5050 (routine/main.py DEFAULTS)
#   /display/photo/                 → Photo-Buddy   127.0.0.1:5051 (photo/main.py DEFAULTS, PHOTO-2)
#   /display/hoerspiel/paula/       → Hörspiel-Buddy Paula 127.0.0.1:5053 (HSP-26, RAT-17, URL-3a)
#   /api/v1/hoerspiel/paula/        → Hörspiel-Buddy Paula 127.0.0.1:5053 (HSP-26, RAT-17, URL-3a)
#   /display/hoerspiel/neko/        → Hörspiel-Buddy Neko   127.0.0.1:5055 (HSP-28a, RAT-17, URL-3a)
#   /api/v1/hoerspiel/neko/         → Hörspiel-Buddy Neko   127.0.0.1:5055 (HSP-28a, RAT-17, URL-3a)
#   /display/hoerspiel/niclas/      → Hörspiel-Buddy niclas 127.0.0.1:5056 (T1347, RAT-17, URL-3a)
#   /api/v1/hoerspiel/niclas/       → Hörspiel-Buddy niclas 127.0.0.1:5056 (T1347, RAT-17, URL-3a)
#   /display/hoerspiel/             → Hörspiel-Buddy Paula 127.0.0.1:5053 (Fallback, T4 #910 hebt nach)
#   /api/v1/routine/                → Routine-Buddy 127.0.0.1:5050 (Zeiten-Schreib-API ROUTINE-14, #343)
#   /api/v1/photo/                  → Photo-Buddy   127.0.0.1:5051 (Medien-API PHOTO-13..16)
#   /api/v1/hoerspiel/              → Hörspiel-Buddy Paula 127.0.0.1:5053 (Fallback, T4 #910 hebt nach)
#   /api/v1/plan/                   → Plan-Buddy    127.0.0.1:5020
#   /api/v1/familie/                → Familie       127.0.0.1:5010 (familie/main.py DEFAULTS, FAM-7/8)
#   /api/v1/geraete/                → Geräte        127.0.0.1:5040 (geraete/main.py DEFAULTS, GER-13/14/15)
#   /api/v1/panels/                 → Panel         127.0.0.1:5041 (panel/main.py DEFAULTS, PREG-13/14/15)
#   /api/v1/seiten (exakt)          → Seiten        127.0.0.1:5042 (seiten/main.py DEFAULTS, SREG-3)
#   /api/v1/icons/suche (exakt)     → Seiten        127.0.0.1:5042 (ROU-31, RAT-31 E6f-B, #1586)
#   /display/_shared/design/        → Seiten        127.0.0.1:5042 (ROU-30, RAT-31 E6f-A, #1582)
#   /display/_shared/icons/         → Seiten        127.0.0.1:5042 (ROU-26, RAT-31 E6f-B, #1586)
#   /controller/app-panel/          → Seiten        127.0.0.1:5042 (SREG-17, #1564)
#   /controller/_shared/            → Seiten        127.0.0.1:5042 (ROU-23, RAT-31 E6f-A, #1582)
#
# RAT-31 (#1568): Der Router-Prozess (127.0.0.1:5000) ist abgerissen. Seine
# allgemeinen Prefixe (/display/, /controller/, /api/v1/) und der SSE-Stream
# /api/v1/displays/<id>/events gibt es nicht mehr — die verbleibenden Sub-Pfade
# sind alle spezifisch an Buddies/Seiten geroutet, alles andere landet im 404.
#
# Reihenfolge zählt (URL-14: spezifisch vor allgemein, längster Prefix
# gewinnt): die Buddy-spezifischen Prefixe (/display/plan/, /api/v1/plan/,
# /api/v1/familie/, /api/v1/geraete/, /api/v1/panels/) stehen vor den
# Seiten-Sub-Prefixen — nginx-`location` mit Prefix wählt den
# längsten Treffer, hier explizit dokumentiert.
#
# Ausrollen: siehe deploy/nginx/README.md. Die Pi-seitige Anwendung
# (Pfade, systemd, Reload) ist Ops.

# Upstream-Definitionen — die getrennten Komponenten-Prozesse.
# (Der Router-Upstream ist mit RAT-31 (#1568) entfallen.)
upstream xbuddy_plan {
    # Plan-Buddy-Prozess (plan/main.py) — Default-Port 5020.
    server 127.0.0.1:5020;
}

upstream xbuddy_wetter {
    # Wetter-Buddy-Prozess (wetter/main.py) — Default-Port 5030 (PORT-2).
    server 127.0.0.1:5030;
}

upstream xbuddy_familie {
    # Familie-Mit-Host-Prozess (familie/main.py) — Default-Port 5010.
    # Liefert Personen-Lese-API (FAM-7) und Profilfoto-Endpunkt (FAM-8).
    server 127.0.0.1:5010;
}

upstream xbuddy_geraete {
    # Geräte-Registry-Prozess (geraete/main.py) — Default-Port 5040 (PORT-2).
    # Liefert Geräte-Lese-API (GER-13/14) und Schreib-API (GER-15).
    server 127.0.0.1:5040;
}

upstream xbuddy_panel {
    # Panel-Registry-Prozess (panel/main.py) — Default-Port 5041 (PORT-2).
    # Liefert Panel-Lese-API (PREG-13/14) und Schreib-API (PREG-15).
    server 127.0.0.1:5041;
}

upstream xbuddy_seiten {
    # Seiten-Registry-Prozess (seiten/main.py) — Default-Port 5042 (PORT-2).
    # Liefert das aggregierte View-Inventar (SREG-3) über GET /api/v1/seiten.
    server 127.0.0.1:5042;
}

upstream xbuddy_routine {
    # Routine-Buddy-Prozess (routine/main.py) — Default-Port 5050 (PORT-2).
    server 127.0.0.1:5050;
}

upstream xbuddy_photo {
    # Photo-Buddy-Prozess (photo/main.py) — Default-Port 5051 (PORT-2).
    # Liefert Display-View (PHOTO-2) und Medien-API (PHOTO-13..16).
    server 127.0.0.1:5051;
}

upstream xbuddy_essen {
    # Essens-Buddy-Prozess (essen/main.py) — Default-Port 5052 (PORT-2, ESSEN-23).
    # Liefert Display-View (ESSEN-2) und Wunsch-/Katalog-API (ESSEN-15..19).
    server 127.0.0.1:5052;
}

upstream xbuddy_hoerspiel {
    # Hörspiel-Buddy-Prozess (hoerspiel/main.py) — Default-Port 5053 (PORT-2, HSP-26).
    # Paula-Instanz. Liefert Display-View (HSP-3) und Folgen-API (HFE-3/HFE-5, HSP-17).
    server 127.0.0.1:5053;
}

upstream xbuddy_hoerspiel_neko {
    # Neko-Instanz des Hörspiel-Buddys (RAT-17, HSP-28a, PORT-2).
    # Port 5055 — handverdrahtete zweite Instanz, KEINE Registry.
    server 127.0.0.1:5055;
}

upstream xbuddy_hoerspiel_niclas {
    # niclas-Instanz des Hörspiel-Buddys (RAT-17, T1347, PORT-2).
    # Port 5056 — handverdrahtete dritte Instanz, KEINE Registry.
    server 127.0.0.1:5056;
}

upstream xbuddy_kibuddy {
    # KIBuddy-Prozess (kibuddy/main.py) — Default-Port 5054 (PORT-2, KIBUDDY-25).
    # Liefert Display-View (KIBUDDY-2) und Frage-/Config-/Prompt-API (KIBUDDY-24).
    server 127.0.0.1:5054;
}

server {
    # URL-12: EINE Origin. Genau ein listen-Port, ein Server-Zertifikat.
    listen      8443 ssl;
    listen      [::]:8443 ssl;
    # HTTP/2 PFLICHT (#1256): Panel haelt 2 SSE + Display 1 = 3 Dauerverbindungen;
    # unter HTTP/1.1 (6-Verbindungen/Host-Limit) verstopfen tote SSE nach Tablet-
    # Sleep/Wake den Pool -> Seite friert (Kacheln/Taps tot). HTTP/2 multiplext ->
    # kein Limit. Ohne diese Zeile kehrt der Wake-Freeze zurueck. Refs #1256, #1248.
    http2 on;
    # server_name akzeptiert die lokalen Heim-Hostnames + optional den
    # Tailscale-Funnel-FQDN (#711, MAD-6). __XBUDDY_TAILSCALE_FQDN__ ist ein
    # Per-Instanz-Platzhalter (z. B. buddyboard.taile235cf.ts.net) — beim
    # Ausrollen via install.sh mit sed ersetzen. Falls keine Mini-App-Public-
    # Hosting: Platzhalter durch leeren String ersetzen oder Zeile streichen.
    #
    # ⚠️ STOP — DEPLOY-WARNUNG (#980, Vorfall T966 2026-06-16):
    # Blindes `cp deploy/nginx/xbuddy-origin.conf /etc/nginx/conf.d/` killt
    # den Funnel, weil der Platzhalter den Live-FQDN überschreibt.
    #
    # Pflicht-Sequenz beim manuellen Deploy (wenn install.sh nicht verwendet):
    #   (1) Live-Wert merken:
    #       FQDN=$(grep -oP '__XBUDDY_TAILSCALE_FQDN__|[\w-]+\.ts\.net' \
    #           /etc/nginx/conf.d/xbuddy-origin.conf | grep -v FQDN | head -1)
    #   (2) Conf kopieren:
    #       sudo cp deploy/nginx/xbuddy-origin.conf /etc/nginx/conf.d/
    #   (3) Platzhalter ersetzen (sed-Fill-Schritt):
    #       sudo sed -i "s/__XBUDDY_TAILSCALE_FQDN__/${FQDN}/g" \
    #           /etc/nginx/conf.d/xbuddy-origin.conf
    #   (4) Validieren: sudo nginx -t
    #   (5) Laden:      sudo systemctl reload nginx
    #
    # Bei Verwendung von deploy/nginx/install.sh: das Skript kopiert die Conf,
    # aber setzt den FQDN NICHT automatisch — Schritt (1)+(3) VOR bzw. NACH dem
    # install.sh-Aufruf manuell ausführen. Langfrist-Lösung: #972 Punkt 6.
    server_name xbuddy-hub.local localhost __XBUDDY_TAILSCALE_FQDN__;

    # Funnel(443) vs LAN(8443): absolute Redirects mit :8443 sind über den
    # Funnel tot → relativ machen (Browser behaelt Origin+Port). (#1459)
    absolute_redirect off;
    proxy_redirect ~^https?://[^/]+(/.*)$ $1;

    # URL-11: HTTPS mit dem Tailscale-LE-Zertifikat.
    # Tailscale-LE via `tailscale cert`, erneuert durch xbuddy-cert-renew.timer;
    # self-signed (make-ca.sh) abgelöst, #1458.
    # __XBUDDY_TAILSCALE_FQDN__ ist ein Per-Instanz-Platzhalter (z. B.
    # buddyboard.taile235cf.ts.net) — beim Ausrollen per sed ersetzen
    # (gleicher sed-Fill-Schritt wie server_name, siehe STOP-DEPLOY-WARNUNG oben).
    ssl_certificate     /var/lib/tailscale/certs/__XBUDDY_TAILSCALE_FQDN__.crt;
    ssl_certificate_key /var/lib/tailscale/certs/__XBUDDY_TAILSCALE_FQDN__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy-Header — die Komponenten sehen die echte Origin-Adresse.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --- Admin-Endpoints: Loopback-only, NICHT vom Netz erreichbar ------
    # /api/v1/<komponente>/admin/* — Reload, Healthchecks, Wartungs-Werkzeuge.
    # Die Reload-Endpoints der Komponenten (z. B. Plan-Buddy #140, EC-21)
    # erwarten 127.0.0.1; nginx
    # ist Defense in Depth und blockiert hier sichtbar an der Origin, damit
    # ein versehentliches „Admin frei ans Internet" nicht passieren kann.
    # Regex-Location hat Vorrang vor Prefix-Locations (URL-14), die Regel
    # greift also vor den /api/v1/-Prefixen weiter unten. 404 statt 403,
    # damit die Existenz von Admin-Endpoints von außen nicht sichtbar wird.
    location ~ ^/api/v1/[^/]+/admin/ {
        return 404;
    }

    # --- Plan-Buddy: spezifische Prefixe zuerst (URL-1) -----------------
    # /display/plan/* — Display-Views des Plan-Buddys.
    location /display/plan/ {
        proxy_pass http://xbuddy_plan;
    }

    # --- Wetter-Buddy: spezifischer Prefix (URL-14, #137) ----------------
    # /display/wetter/* — Display-View des Wetter-Buddys (WETTER-2).
    # Muss VOR dem allgemeinen /display/-Block stehen (längster Prefix
    # gewinnt — URL-14). Wetter hat in V1 keine API (E-WETTER-3).
    location /display/wetter/ {
        proxy_pass http://xbuddy_wetter;
    }

    # --- Routine-Buddy: spezifische Prefixe (URL-14, #335, #343) ----------
    # /display/routine/* — Display-View (ROUTINE-2) und /api/v1/routine/* —
    # Zeiten-Schreib-API (ROUTINE-14, #343). Beide VOR den allgemeinen
    # /display/- bzw. /api/v1/-Blöcken (längster Prefix gewinnt — URL-14).
    # Admin-Pfade fängt die Regex oben (404).
    location /display/routine/ {
        proxy_pass http://xbuddy_routine;
    }

    # --- Photo-Buddy: spezifische Prefixe (URL-14, #344) ----------------
    # /display/photo/* — Display-View (PHOTO-2) und /api/v1/photo/* — Medien-API
    # (PHOTO-13..16). Beide VOR den allgemeinen /display/- bzw. /api/v1/-Blöcken
    # (längster Prefix gewinnt — URL-14). Admin-Pfade fängt die Regex oben (404).
    location /display/photo/ {
        proxy_pass http://xbuddy_photo;
    }
    location /api/v1/photo/ {
        proxy_pass http://xbuddy_photo;
    }

    # --- Essens-Buddy: spezifische Prefixe (URL-14, ESSEN-23/24, #474) --
    # /display/essen/* — Display-View (ESSEN-2) und /api/v1/essen/* — Wunsch-
    # und Katalog-API (ESSEN-15..19). Beide VOR den allgemeinen /display/- bzw.
    # /api/v1/-Blöcken (längster Prefix gewinnt — URL-14).
    location /display/essen/ {
        proxy_pass http://xbuddy_essen;
    }
    location /api/v1/essen/ {
        proxy_pass http://xbuddy_essen;
    }

    # --- Hörspiel-Buddy: kind_id-tragende Form (URL-3a, HSP-26, RAT-17) ---
    # Längster Prefix gewinnt (URL-14): kind_id-tragende Prefixe vor dem
    # allgemeinen /display/hoerspiel/-Pattern. Drei explizite Instanzen
    # Paula + Neko + niclas handverdrahtet (RAT-17 Option A, HSP-28a, T1347).
    # Admin-Pfade fängt die Regex oben (404).
    #
    # Exakte SSE-Locations für /audio-stream VOR den Prefix-Locations
    # (HSP-42 Audio-Source-Push, RATIFIZIERT 2026-06-17). Pattern analog
    # zur Display-Events-SSE-Location unten (Z. 368+): proxy_buffering off,
    # proxy_cache off, proxy_read_timeout 1h. Ohne diese werden SSE-Events
    # von nginx gepuffert und kommen am Browser erst verspätet an.
    location = /api/v1/hoerspiel/paula/audio-stream {
        proxy_pass http://xbuddy_hoerspiel;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location = /api/v1/hoerspiel/neko/audio-stream {
        proxy_pass http://xbuddy_hoerspiel_neko;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location = /api/v1/hoerspiel/niclas/audio-stream {
        proxy_pass http://xbuddy_hoerspiel_niclas;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    # exact-match ohne Trailing-Slash: verhindert nginx' proxy_pass-Slash-
    # Redirect mit :8443, der ueber den Funnel tot ist (#1459).
    location = /display/hoerspiel/paula {
        proxy_pass http://xbuddy_hoerspiel;
    }
    location /display/hoerspiel/paula/ {
        proxy_pass http://xbuddy_hoerspiel;
    }
    location /api/v1/hoerspiel/paula/ {
        proxy_pass http://xbuddy_hoerspiel;
    }
    location = /display/hoerspiel/neko {
        proxy_pass http://xbuddy_hoerspiel_neko;
    }
    location /display/hoerspiel/neko/ {
        proxy_pass http://xbuddy_hoerspiel_neko;
    }
    location /api/v1/hoerspiel/neko/ {
        proxy_pass http://xbuddy_hoerspiel_neko;
    }
    location = /display/hoerspiel/niclas {
        proxy_pass http://xbuddy_hoerspiel_niclas;
    }
    location /display/hoerspiel/niclas/ {
        proxy_pass http://xbuddy_hoerspiel_niclas;
    }
    location /api/v1/hoerspiel/niclas/ {
        proxy_pass http://xbuddy_hoerspiel_niclas;
    }
    # Fallback /display/hoerspiel/ ohne <kind_id> → Paula (Themen-Endpoint
    # bleibt einstweilen ohne kind_id, T4 #910 hebt nach):
    location /display/hoerspiel/ {
        proxy_pass http://xbuddy_hoerspiel;
    }
    location /api/v1/hoerspiel/ {
        proxy_pass http://xbuddy_hoerspiel;
    }

    # --- KIBuddy: spezifische Prefixe (URL-14, KIBUDDY-24/25, #822) ----------
    # /display/kibuddy/* — Frage-View (KIBUDDY-2) und statische Assets. Beide VOR
    # den allgemeinen /display/- bzw. /api/v1/-Blöcken (längster Prefix gewinnt —
    # URL-14). Admin-Pfade fängt die Regex oben (404).
    location /display/kibuddy/ {
        proxy_pass http://xbuddy_kibuddy;
    }
    location /api/v1/kibuddy/ {
        proxy_pass http://xbuddy_kibuddy;
        # KIBUDDY-21 aufnahme.max-sek=30 → ~1.5 MB Opus + Container-Overhead;
        # 10 MB ist großzügig (auch lange MP4-Container).
        client_max_body_size 10m;
    }

    # /api/v1/routine/* — Routine-Buddy-Backend (Zeiten-Schreib-API, ROUTINE-14, #343).
    location /api/v1/routine/ {
        proxy_pass http://xbuddy_routine;
    }

    # /api/v1/plan/* — Plan-Buddy-Backend (Termine, Zuteilung, Aktivität).
    location /api/v1/plan/ {
        proxy_pass http://xbuddy_plan;
    }

    # --- Familie: spezifischer Prefix vor /api/v1/ (URL-14, #85) --------
    # /api/v1/familie/* — Familien-Mit-Host (Personen-Liste FAM-7,
    # Profilfotos FAM-8). Muss VOR dem allgemeinen /api/v1/-Block stehen,
    # sonst landen Foto-Requests beim Router (5000) statt bei Familie
    # (5010) — siehe Plan-Buddy-Wireframes, die `/api/v1/familie/foto/<id>`
    # einbetten (PLAN-24 → FAM-8). Kein SSE, also keine Spezial-Direktiven.
    location /api/v1/familie/ {
        proxy_pass http://xbuddy_familie;
    }

    # --- Geräte: spezifischer Prefix vor /api/v1/ (URL-14, #212) --------
    # /api/v1/geraete/* — Geräte-Registry (GER-13/14/15). Muss VOR dem
    # allgemeinen /api/v1/-Block stehen, sonst landen Geräte-Requests beim
    # Router (5000) statt bei der Geräte-Registry (5040). Kein SSE, also
    # keine Spezial-Direktiven.
    location /api/v1/geraete/ {
        proxy_pass http://xbuddy_geraete;
    }

    # --- Panel-Registry: spezifischer Prefix vor /api/v1/ (URL-14, #58) --
    # /api/v1/panels/* — Panel-Registry (PREG-13/14/15). Muss VOR dem
    # allgemeinen /api/v1/-Block stehen, sonst landen Panel-Requests beim
    # Router (5000) statt bei der Panel-Registry (5041). Kein SSE, also
    # keine Spezial-Direktiven.
    location /api/v1/panels/ {
        proxy_pass http://xbuddy_panel;
    }

    # --- Seiten-Registry: exakter Match + Sub-Pfade (URL-14, SREG-3, SREG-12, #467) -
    # `= /api/v1/seiten` — das aggregierte View-Inventar (SREG-3). Exakter
    # Match (kein Prefix): die Registry hat den Lese-Endpunkt.
    # `^~ /api/v1/seiten/admin/` — Admin-Pfade (URL-17, #616): der allgemeine
    # Regex-Admin-Block (`~ ^/api/v1/[^/]+/admin/`) würde gegen `^~ /api/v1/seiten/`
    # verlieren, weil nginx `^~` vor Regex auswertet. Deshalb steht hier ein eigener
    # `^~`-Admin-Block, der 404 zurückgibt und SPEZIFISCHER als `/api/v1/seiten/`
    # ist — er muss VOR dem allgemeinen Seiten-Prefix stehen (längster ^~-Prefix
    # gewinnt: URL-14 + nginx-Auswertungsreihenfolge).
    # `^~ /api/v1/seiten/` — alle anderen Sub-Pfade (Form A, SREG-12 / #467): aktuell
    # `/api/v1/seiten/uebersicht` (gerenderte Eltern-Übersicht, HTML). Das
    # `^~`-Prefix-Modifier weist nginx an, NICHT mehr nach Regex-Locations zu
    # suchen, sobald dieser Prefix matched — dadurch bleibt der allgemeine
    # `/api/v1/`-Block für andere Pfade unberührt, ohne ihn vor den Seiten-
    # Block ziehen zu müssen.
    location = /api/v1/seiten {
        proxy_pass http://xbuddy_seiten;
    }
    location ^~ /api/v1/seiten/admin/ {
        return 404;
    }
    location ^~ /api/v1/seiten/ {
        proxy_pass http://xbuddy_seiten;
    }

    # --- Mini-App-Frontend für Eltern-Einkauf (T653, ESSEN-30/31, EZG-6) ----
    # /seiten/essen/* — Mini-App-HTML aus seiten-Service. JS/CSS-Assets liegen
    # unter /api/v1/seiten/static/ (Flask static_url_path) und gehen über den
    # /api/v1/seiten/-Block oben. Folge-Ticket #711 hat die Routen aus dem
    # Live-Setup hier hereingezogen.
    location /seiten/essen/ {
        proxy_pass http://xbuddy_seiten;
    }

    # --- Mini-App-Frontend für Eltern-Routine-Anpassen (T728, ROUTINE-20, RAO-6) ----
    # /seiten/routine/* — Mini-App-HTML aus seiten-Service (analog /seiten/essen/).
    # Schreibwirkung läuft über /api/v1/routine/* (Routine-Buddy ROUTINE-14),
    # nicht durch diesen Block. JS/CSS unter /api/v1/seiten/static/ wie bisher.
    location /seiten/routine/ {
        proxy_pass http://xbuddy_seiten;
    }

    # --- Eltern-Einstellungs-PWA Plan-Buddy (T1126, PLAN-35) ----------------
    # /seiten/plan/* — Homescreen-PWA-HTML aus seiten-Service (analog /seiten/essen/,
    # /seiten/routine/). Schreibwirkung über /api/v1/plan/* (PLAN-36/37), nicht durch
    # diesen Block. JS/CSS/manifest/sw unter /api/v1/seiten/static/.
    location /seiten/plan/ {
        proxy_pass http://xbuddy_seiten;
    }

    # --- Mini-App-Frontend für Eltern-Hörspiel (HSP-33) ----
    # /seiten/hoerspiel/* — Mini-App-HTML aus seiten-Service (analog
    # /seiten/routine/). JS/CSS-Assets unter /api/v1/seiten/static/ wie
    # bisher. Beendet 404 aus #966 (Eltern-Mini-App war nicht geroutet).
    location /seiten/hoerspiel/ {
        proxy_pass http://xbuddy_seiten;
    }

    # --- Heim-Shell: Haupt-Tablet-Sicht (SHELL-1, heim-shell.md) ---------------
    # /shell/<panel_id> — HTML-Sicht der Heim-Shell (Haupt-Tablet-URL).
    # Serviert vom seiten-Service (Port 5042); kein allgemeiner /shell/-Router-
    # Fallback mehr (RAT-31). Same-Origin mit /controller/app-panel/ (SHELL-3).
    # Einschließt /shell/<panel_id>/events (SSE-Zustands-Stream, SHELL-4).
    location /shell/ {
        proxy_pass http://xbuddy_seiten;
    }

    # --- Geräte-Pairing /auth/pair (T948, auth.md AUTH-2.a / GAA-3.8) -------
    # GET /auth/pair?token=<X> — der im Familien-Bot gepostete Pairing-Link
    # (15-Minuten-HMAC-Token) landet extern hier. seiten/main.py::auth_pair
    # verifiziert den Token, setzt den xbuddy_session-Cookie (AUTH-2) und
    # redirected auf /display/<id> (fällt an den /display/-Block unten →
    # Router). Ohne diese Route liefe der Link ins 404. Exakt-Match (`= `,
    # höchste Priorität), additiv — Upstream wie die anderen seiten-Routen
    # (xbuddy_seiten, Port 5042).
    location = /auth/pair {
        proxy_pass http://xbuddy_seiten;
    }

    # --- Design-Token-Strang: spezifischer Prefix vor /display/ (ROU-30, RAT-31 E6f-A, #1582) -
    # /display/_shared/design/* — geteilter Design-Token-Strang (tokens.css,
    # DTOK-1/2). Wird seit RAT-31 E6f-A (#1582) vom seiten-Service serviert,
    # NICHT mehr vom Router. Muss VOR dem allgemeinen /display/-Block stehen
    # (längster Prefix gewinnt, URL-14), sonst landet der Request beim Router.
    # Kein SSE, kein Auth-Gate (analog Router ROU-30 — ungegated statischer Asset).
    location /display/_shared/design/ {
        proxy_pass http://xbuddy_seiten;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Icon-Bibliothek: seit RAT-31 E6f-B vom seiten-Service serviert ----
    # /display/_shared/icons/ — zentrale, geteilte ARASAAC-Piktogramme
    # (specs/platform/icons.md ICONS-5, ROU-26). Verlagert nach seiten (#1586):
    # eigener spezifischer /display/-Prefix (URL-14). seiten laeuft als User
    # buddy und liest die icon-root (0700) problemlos; der Router-Zwilling ist
    # mit RAT-31 (#1568) abgerissen. Kein Auth-Gate
    # (Display-Views laden credential-los, analog Router ROU-26).
    location /display/_shared/icons/ {
        proxy_pass http://xbuddy_seiten;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- App-Panel-Serving: spezifischer Prefix vor /controller/ (SREG-17, #1564) -
    # /controller/app-panel/* — die App-Panel-Instanz-Views (index.html + Assets,
    # config/tiles/bearbeiten-Proxy) werden seit RAT-31 E6b (#1564) vom seiten-
    # Service serviert, NICHT mehr vom Router. Same-Origin zu /shell/<id> (SHELL-3
    # Rail-Iframe). Muss VOR dem allgemeinen /controller/-Block stehen (längster
    # Prefix gewinnt, analog /api/v1/panels/ vor /api/v1/). Kein SSE, Header vom Server-Block.
    location /controller/app-panel/ {
        proxy_pass http://xbuddy_seiten;
    }

    # --- Controller-Shared: spezifischer Prefix vor /controller/ (ROU-23, RAT-31 E6f-A, #1582) -
    # /controller/_shared/* — PWA-übergreifende Helper (config.js, ROU-23).
    # Wird seit RAT-31 E6f-A (#1582) vom seiten-Service serviert, NICHT mehr vom
    # Router. Muss VOR dem allgemeinen /controller/-Block stehen (längster Prefix
    # gewinnt, URL-14). Kein SSE, kein Auth-Gate (analog Router ROU-23 — ungegated
    # statischer Asset, SW-Precache darf kein Gate bekommen).
    location /controller/_shared/ {
        proxy_pass http://xbuddy_seiten;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Icons-Suche: exakter Match vor allgemeinem /api/v1/ (ROU-31, RAT-31 E6f-B, #1586) ---
    # GET /api/v1/icons/suche — Stichwort-Suche ueber den lokalen Icon-Cache.
    # Verlagert nach seiten (#1586). Exakt-Match (= ) hat hoechste Prioritaet
    # unter Prefix-Locations (URL-14).
    location = /api/v1/icons/suche {
        proxy_pass http://xbuddy_seiten;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RAT-31 (#1568): Der Router-Prozess ist abgerissen. Seine allgemeinen
    # Prefixe (/display/, /controller/, /api/v1/, SSE /api/v1/displays/…/events)
    # gibt es nicht mehr — die verbleibenden Buddy-/Seiten-Sub-Pfade sind oben
    # spezifisch geroutet, alles andere faellt auf das 404 unten.

    # URL-1: andere Top-Level-Pfade sind nicht erlaubt.
    location / {
        return 404;
    }
}
