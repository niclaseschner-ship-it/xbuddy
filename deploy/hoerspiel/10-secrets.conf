# systemd Drop-In für xbuddy-hoerspiel.service — Geheimnisse (HSP-27).
#
# Ablage: /etc/systemd/system/xbuddy-hoerspiel.service.d/10-secrets.conf
#
# Die ENV-Datei wird NICHT aus diesem Repo geliefert; sie liegt unter der
# Per-Instanz-Datenwurzel (SVC-5) und wird durch tools/sync_hoerspiel_env.py
# aus /home/buddy/xbuddy-data/zugangsdaten/zugangsdaten.json erzeugt.
#
# Keys in zugangsdaten.json:
#   hoerspiel-llm-provider-name        → HOERSPIEL_LLM_PROVIDER
#   hoerspiel-llm-provider-api-key     → HOERSPIEL_ANTHROPIC_KEY
#   hoerspiel-azure-openai-key         → HOERSPIEL_AZURE_OPENAI_KEY
#   hoerspiel-azure-openai-endpoint    → HOERSPIEL_AZURE_OPENAI_ENDPOINT
#   hoerspiel-azure-openai-deployment  → HOERSPIEL_AZURE_OPENAI_DEPLOYMENT
#
# Einrichten:
#   python3 tools/sync_hoerspiel_env.py
#   sudo systemctl daemon-reload
#   sudo systemctl restart xbuddy-hoerspiel

[Service]
EnvironmentFile=/home/buddy/xbuddy-data/zugangsdaten/hoerspiel-env
