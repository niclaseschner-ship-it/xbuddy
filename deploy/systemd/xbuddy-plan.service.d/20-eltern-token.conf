# Bot-Token-Sharing (RAT-16): plan liest die eltern-chat-.env read-only.
#
# ALTLAST seit #1891 — plan/plan.service traegt dieselbe EnvironmentFile-Zeile
# bereits inline. Dieses Drop-In wiederholt sie nur.
#
# BEWUSST NICHT entfernt: die Vorlage ist der korrekte Ort (der Pfad ist ueber
# __XBUDDY_DATA__ ausdrueckbar, also nichts, was nur ein Drop-In koennte). Die
# Datei liegt aber auch in /etc, und die Soll-Liste in README.md muesste mit —
# zwei Vorgaenge fuer null funktionalen Gewinn. Doppelt gesetzt schadet nicht:
# systemd liest EnvironmentFile idempotent, beide Zeilen zeigen auf dieselbe
# Datei.
#
# AUFLOESUNG: mit dem naechsten Aufraeum-Schritt fuer /etc-Artefakte, dann in
# einem Zug Datei + Soll-Zeile.
[Service]
EnvironmentFile=__XBUDDY_DATA__/eltern-chat/.env
