# Neustart-Bremse für xbuddy-plan (#1801).
#
# ---------------------------------------------------------------------------
# Der Fehler, den dieses Drop-In behebt
# ---------------------------------------------------------------------------
# Live liefen xbuddy-plan und xbuddy-familie mit RestartSec=10s im Takt und
# dem UNGESETZTEN, also systemd-default StartLimitIntervalSec=10s /
# StartLimitBurst=5. Ein Fenster, das GENAUSO LANG ist wie die Wartezeit
# zwischen zwei Neustarts, kann rechnerisch nie fünf Versuche INNERHALB von
# sich selbst sammeln: jeder Neustart fällt in ein frisch geöffnetes Fenster
# und der Zähler beginnt wieder bei null. Die Bremse existiert, greift aber
# nie.
#
# Beleg: am 2026-08-10 stürzten beide Dienste 14× in Folge ab, ohne dass
# systemd eingriff (#1801). `systemctl show xbuddy-plan -p
# StartLimitIntervalUSec -p StartLimitBurst -p RestartUSec` zeigte zum
# Zeitpunkt der Diagnose `10s` / `5` / `10s` — exakt dieser Fall.
#
# ---------------------------------------------------------------------------
# Die Rechnung — gegen die tatsächlichen Absturz-Abstände geprüft
# ---------------------------------------------------------------------------
# Damit fünf Neustarts überhaupt in EIN Fenster passen können, muss das
# Fenster größer sein als die Zeit, die fünf Versuche im RestartSec-Takt
# brauchen:
#
#   RestartSec × StartLimitBurst = 10s × 5 = 50s   (Zeitpunkt des 5. Versuchs)
#
# `journalctl -u xbuddy-plan` vom 10.08. zeigt für den echten Crash-Loop
# Neustarts um 10:28:59, :29:10, :29:20, :29:30, :29:40, :29:51 — Abstand
# durchgehend ~10,4s, der Dienst stirbt in derselben Sekunde, in der er
# startet. Der fünfte Versuch liegt damit bei ~52s nach dem ersten. Ein
# 120s-Fenster hätte an dieser realen Zeitreihe gegriffen, nicht nur an der
# Rechnung mit dem Nominal-Takt — StartLimitIntervalSec=120s ist knapp das
# Doppelte der 52s-Marke (120s > 52s), keine Scheingenauigkeit wie „51s",
# aber auch kein beliebiger Rundungs-Puffer, sondern derselbe Vorschlag, den
# das Ticket selbst macht (#1801).
#
# Grenze der Rechnung (notwendig, nicht hinreichend): Sie geht von einem
# Dienst aus, der SOFORT nach dem Start abstürzt (Eigenlaufzeit ≈ 0s, wie am
# 10.08. gemessen). RestartSec × Burst zählt nur die Warte-Pausen zwischen
# Versuchen, nicht die Zeit, die ein Dienst VOR dem Absturz tatsächlich
# läuft. Ein Dienst, der erst nach z. B. 20s Laufzeit stirbt, braucht für
# fünf Versuche eher (20s + 10s) × 5 = 150s — dann wäre 120s wieder zu knapp.
# Für den hier belegten Fall (Sofort-Absturz) passt die Zahl; bei einem
# andersartigen Crash-Muster ist sie neu zu prüfen, nicht blind zu kopieren.
#
# `Restart=on-failure` steht bereits in der Basis-Vorlage (plan/plan.service,
# SVC-3, conventions/services.md) — dieses Drop-In koppelt nur Fenster und
# Wartezeit auseinander, ohne die Restart-Strategie zu duplizieren.
#
# Zustand (Stand 2026-08-17): dieses Drop-In liegt im Repo, ist aber noch
# NICHT auf der Maschine ausgerollt (`systemctl show xbuddy-plan -p
# StartLimitIntervalUSec` zeigt weiterhin `10s`, `DropInPaths` enthält keine
# `restart-window.conf`). Die Bremse greift, SOBALD ausgerollt — nicht
# vorher. Ausrollen siehe deploy/systemd/README.md, Abschnitt „Ausrollen der
# Neustart-Bremse".
#
# ---------------------------------------------------------------------------
# Zweiter Befund (#1801): Repo-Vorlage vs. Live-Stand bei Restart=
# ---------------------------------------------------------------------------
# `plan/plan.service` sagt `Restart=on-failure` (SVC-3-konform). Live steht
# stattdessen hand-editiert `Restart=always` DIREKT in der Basis-Unit-Datei
# (nicht über ein Drop-In) — siehe deploy/systemd/README.md, Abschnitt
# „Bekannte Vorlagen-Drift". Dieses Drop-In behebt NICHT diese Drift (dazu
# müsste die Basis-Unit-Datei in /etc neu ausgerollt werden, kein
# Drop-In-Job) — es macht die Bremse nur unabhängig davon wirksam, welchen
# Restart-Modus die Maschine gerade fährt.

[Unit]
StartLimitIntervalSec=120
StartLimitBurst=5
