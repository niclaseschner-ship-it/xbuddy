# Speicher-Notbremse für xbuddy-plan (#1785).
#
# Zwei Hebel, bewusst als Paar:
#   MemoryHigh      — weiche Bremse. Der Kernel drosselt/reklamiert oberhalb
#                     der Grenze, er tötet NICHT. Ein gedrosselter Dienst ist
#                     diagnostizierbar (`memory.events` high-Zähler steigt),
#                     ein getöteter verschwindet nur.
#   OOMScoreAdjust  — Opfer-Wahl. Erklärt diesen Dienst als Nicht-Kandidaten,
#                     wenn der Host unter Druck gerät.
#
# ---------------------------------------------------------------------------
# Woher die 128M kommen (GEMESSEN, nicht geraten — Stand 2026-08-10)
# ---------------------------------------------------------------------------
# Pro-Instanz-Spitzen aus dem journal (`journalctl -u xbuddy-plan | grep
# "memory peak"`, 60-Tage-Fenster):
#   30.4M · 30.3M · 32.6M · 27.4M · 29.9M · 29.8M · 24.0M · 25.1M · 30.8M
#   → Allzeit-Maximum 32.6M
# Der längste beobachtete Lauf (Aug 07 10:53 → Aug 10 10:28, ~3 Tage) endete
# bei 30.8M Spitze. Über drei Tage FLACH — kein Leck-Gradient messbar.
#
# 128M ≈ 4× das Allzeit-Maximum. Damit gilt beides:
#   - Im Normalbetrieb wird die Bremse nie berührt (kein Drossel-Risiko für
#     eine Familie, die den Plan gerade offen hat).
#   - Ein echter Ausreißer (4× über allem, was je gemessen wurde) läuft in die
#     Drosselung, statt den Host mitzunehmen.
# Für plan und familie steht dieselbe Zahl: beide sind ~30M-Flask-Dienste mit
# fast identischem Profil (32.6M vs. 27.8M). 128M vs. 112M zu spalten wäre
# Scheingenauigkeit auf 5M Unterschied.
#
# ---------------------------------------------------------------------------
# Warum OOMScoreAdjust NEGATIV ist (und kein MemoryMax gesetzt wird)
# ---------------------------------------------------------------------------
# Die Ticket-Annahme war, plan/familie seien die OOM-VERURSACHER. Die Messung
# widerlegt das (siehe PR #1790): `memory.events:oom_kill` ist 0, und über 60
# Tage steht kein einziges Kernel-OOM im journal. Wer hier tatsächlich stirbt,
# wählt `earlyoom` nach `oom_score` aus — und traf zuletzt (Aug 06 22:15) den
# Kiosk-Audio-Stack (pipewire, wireplumber, gvfsd, chromium), während die
# eigentlichen RAM-Fresser unangetastet blieben.
#
# Einen 30M-Dienst zu töten befreit 0.4 % des RAM und nimmt der Familie die
# Plan-Ansicht. Schlechter Tausch in jede Richtung → dieser Dienst ist kein
# Opfer. -500 klemmt die badness-Bewertung an den Boden, ohne Unsterblichkeit
# zu behaupten (Bereich ist -1000…1000).
#
# MemoryHigh ist die Bedingung, unter der dieses Schützen sicher ist: ein
# geschützter UND unbegrenzter Dienst wäre der klassische Fußschuss. Erst
# begrenzt, dann geschützt.
#
# MemoryMax ist ABSICHTLICH nicht gesetzt: es wäre ein neuer Tötungs-Pfad in
# einem Live-Familien-Dienst, und das Ticket verlangt ausdrücklich die „Bremse
# VOR dem Kill". Offene Entscheidung für Nic (PR #1790).

[Service]
MemoryHigh=128M
OOMScoreAdjust=-500
