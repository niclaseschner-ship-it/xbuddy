[Service]
# T1389 AUTH-2.a: paired_at-Store-Pfad (OD3). /auth/pair schreibt den paired_at-
# Stempel additiv in denselben geraete.json-Store, den frueher xbuddy-geraete
# fuehrte.
#
# ALTLAST seit #1891 — seiten/seiten.service traegt dieselbe Zuweisung bereits
# inline. Dieses Drop-In wiederholt sie nur.
#
# BEWUSST NICHT entfernt, gleiche Begruendung wie bei
# plan/20-eltern-token.conf: die Vorlage ist der korrekte Ort, das Entfernen
# braucht zwei Vorgaenge (Datei in /etc + Soll-Zeile), und die Doppelung ist
# funktional folgenlos — beide setzen denselben Wert.
#
# AUFLOESUNG: mit dem naechsten Aufraeum-Schritt fuer /etc-Artefakte.
Environment=GERAETE_REGISTRY=__XBUDDY_DATA__/geraete/geraete.json
