# Nic-Setzung 2026-07-31: alles per Public-Link (Funnel-FQDN, LE-Cert) + Cookie.
# KEIN self-signed/IP. Heim-IP + Tailscale-IP entfernt.
#
# Der FQDN ist per-Instanz und steht deshalb als Platzhalter
# (__XBUDDY_DISPLAY_ORIGIN_FUNNEL__, siehe Platzhalter-Tabelle in
# deploy/systemd/README.md); bootstrap.sh substituiert ihn aus dem Host-Profil.
[Service]
Environment=SEITEN_FUNNEL_ORIGIN=__XBUDDY_DISPLAY_ORIGIN_FUNNEL__
Environment=SEITEN_HEIM_ORIGIN=
