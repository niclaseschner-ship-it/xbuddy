# Drop-In fuer xbuddy-seiten.service — Zugangsdaten-Store-Pfad (#1086 Connector).
# Die Connector-Seite (Sektion 1, CONN-1) enumeriert das LLM-Provider-Inventar
# aus dem ZD-Slot-Store — nur .names()/Anzahl, NIE Werte (CONN-7). Ohne dieses
# Override faellt resolve_store_path() auf DEFAULT_STORE_FILE (Store neben dem
# Code = stale Repo-Checkout) zurueck; seiten wuerde das falsche Inventar zeigen.
# Spiegelt das Geschwister-Muster: eltern-chat 20-zugangsdaten.conf,
# kibuddy 30-zugangsdaten-path.conf. seiten liest STRIKT weniger als die
# Geschwister (nur Slot-Namen, keine Key-Werte) — bleibt im PUBLIC/AUTH-6-
# Envelope, haertet gemeinsam ueber #948.
[Service]
Environment="ZUGANGSDATEN_STORE_FILE=__XBUDDY_DATA__/zugangsdaten/zugangsdaten.json"
