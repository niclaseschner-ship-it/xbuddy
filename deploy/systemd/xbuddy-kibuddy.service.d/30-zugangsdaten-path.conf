# Drop-In fuer xbuddy-kibuddy.service — Zugangsdaten-Store-Pfad (T1082-Folge).
# SVC-5: Geheimnisse liegen AUSSERHALB des Checkouts. tools.llm liest den Store
# aber ueber DEFAULT_STORE_FILE = <repo>/tools/zugangsdaten/zugangsdaten.json —
# gleiche Inkonsistenz wie KIBUDDY_CONFIG_FILE in 20-config-path.conf.
# sync_kibuddy_env.py schreibt den LLMP-5-Slot kibuddy-anthropic-api-key in den
# xbuddy-data-Store; ohne dieses Override faende tools.llm ihn nie
# -> LLMCapabilityError beim ersten Kind-Call.
[Service]
Environment=ZUGANGSDATEN_STORE_FILE=__XBUDDY_DATA__/zugangsdaten/zugangsdaten.json
