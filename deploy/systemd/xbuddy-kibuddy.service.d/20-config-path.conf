# Drop-In fuer xbuddy-kibuddy.service — Config-Datei-Pfad (KIBUDDY-21).
# Spec sagt Per-Instanz-Datei <data>/kibuddy/config.json. Code-Default
# zeigt aber auf <repo>/kibuddy/config.json — Override via ENV noetig.
# (Inkonsistenz fuer Folge-Ticket; hier praktische Korrektur.)
[Service]
Environment=KIBUDDY_CONFIG_FILE=__XBUDDY_DATA__/kibuddy/config.json
