# SVC-5-Rettung fuer familie: die Basis-Vorlage familie/familie.service zeigt
# mit `--registry __XBUDDY_REPO__/familie/familie.json` IN den Checkout und
# verletzt damit SVC-5. Dieses Drop-In setzt ExecStart zurueck und neu, sodass
# die Registry unter der Per-Instanz-Datenwurzel liegt.
#
# ACHTUNG (#1802): faellt dieses Drop-In beim Neuaufsetzen weg, startet familie
# gegen den falschen Pfad. Es ist damit funktional noetig, nicht kosmetisch —
# der Grund, warum bootstrap.sh Drop-Ins mit ausrollt. Die Vorlagen-Drift selbst
# ist gemeldet und noch offen (deploy/systemd/README.md, „Bekannte Vorlagen-Drift").
[Service]
ExecStart=
ExecStart=__XBUDDY_PYTHON__ -m familie.main --host 127.0.0.1 --port 5010 --registry __XBUDDY_DATA__/familie/familie.json
