# ALTLAST seit #1891 — dieses Drop-In wiederholt nur noch die Vorlage.
#
# Es entstand, weil familie/familie.service den Registry-Pfad in den Checkout
# legte (SVC-5-Verletzung) und Host/Port nicht setzte. BEIDES steht seit #1891
# in der Vorlage selbst. Der ExecStart=-Reset unten setzt damit denselben Befehl
# noch einmal — funktional ein No-op, aber ein zweiter Ort fuer denselben Wert.
#
# NICHT entfernt, weil das zwei getrennte Vorgaenge braucht: die Datei liegt auch
# in /etc (dort raeumt sie der Aufraeum-Schritt fuer verwaiste Artefakte), und die
# Soll-Liste in deploy/systemd/README.md muesste mitziehen.
#
# AUFLOESUNG: entfernen, sobald ein bootstrap.sh-Lauf gegen einen frischen Host
# belegt hat, dass die korrigierte Vorlage allein traegt. Bis dahin ist die
# Doppelung der sichere Zustand — sie kann nichts kaputt machen, nur verwirren.
#
[Service]
ExecStart=
ExecStart=__XBUDDY_PYTHON__ -m familie.main --host 127.0.0.1 --port 5010 --registry __XBUDDY_DATA__/familie/familie.json
