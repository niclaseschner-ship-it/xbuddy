# Speicher-Notbremse für xbuddy-familie (#1785).
#
# Begründung, Messmethode und die Herleitung der Zahlen stehen ausführlich in
# `deploy/systemd/xbuddy-plan.service.d/memory.conf` — beide Dienste teilen
# dieselbe Argumentation und denselben Grenzwert. Hier nur die eigenen Messwerte.
#
# ---------------------------------------------------------------------------
# Woher die 128M kommen (GEMESSEN, nicht geraten — Stand 2026-08-10)
# ---------------------------------------------------------------------------
# Pro-Instanz-Spitzen aus dem journal (`journalctl -u xbuddy-familie | grep
# "memory peak"`, 60-Tage-Fenster):
#   27.3M · 23.7M · 25.8M · 24.8M · 23.7M · 25.2M · 27.8M
#   → Allzeit-Maximum 27.8M
# Der längste beobachtete Lauf (Aug 07 10:53 → Aug 10 10:28, ~3 Tage) endete
# bei 27.8M Spitze. Über drei Tage FLACH — kein Leck-Gradient messbar.
#
# 128M ≈ 4.6× das Allzeit-Maximum: im Normalbetrieb unerreichbar, für einen
# echten Ausreißer aber eine Bremse vor dem Host-Schaden.
#
# ---------------------------------------------------------------------------
# Kurzfassung der beiden Hebel
# ---------------------------------------------------------------------------
# MemoryHigh     — weiche Bremse, der Kernel drosselt statt zu töten.
# OOMScoreAdjust — negativ, weil dieser Dienst NICHT der Verursacher ist:
#                  `memory.events:oom_kill` = 0, kein Kernel-OOM in 60 Tagen.
#                  Einen 28M-Dienst zu töten befreit nichts und nimmt der
#                  Familie die Registry (Namen, Profilbilder, Auth-Zuordnung).
#
# MemoryMax bleibt absichtlich ungesetzt (kein neuer Tötungs-Pfad in einem
# Live-Familien-Dienst) — offene Entscheidung für Nic, siehe PR #1790.

[Service]
MemoryHigh=128M
OOMScoreAdjust=-500
