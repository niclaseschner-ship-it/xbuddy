# Neustart-Bremse für xbuddy-familie (#1801).
#
# Begründung, Live-Beleg und die Herleitung des Fensters (inkl. der
# gemessenen Absturz-Abstände vom 10.08. und der Grenze der Rechnung) stehen
# ausführlich in `deploy/systemd/xbuddy-plan.service.d/restart-window.conf`
# — beide Dienste teilten dieselbe Fehlkonfiguration (RestartSec=10s bei
# ungesetztem, also systemd-default StartLimitIntervalSec=10s/
# StartLimitBurst=5, Beleg: 14 Abstürze je Dienst am 2026-08-10) und
# bekommen denselben Fix.
#
# ---------------------------------------------------------------------------
# Kurzfassung der Rechnung
# ---------------------------------------------------------------------------
# RestartSec × StartLimitBurst = 10s × 5 = 50s (Nominal-Takt) — die echten
# Absturz-Abstände aus `journalctl -u xbuddy-plan` vom 10.08. (~10,4s je
# Versuch, 5. Versuch bei ~52s) bestätigen das. StartLimitIntervalSec=120s
# liegt darüber. Grenze der Rechnung: sie unterstellt Sofort-Absturz
# (Eigenlaufzeit ≈ 0s) — bei einem Dienst, der erst nach messbarer Laufzeit
# stirbt, ist 120s ggf. neu zu prüfen (siehe plan's Drop-In für die
# Herleitung).
#
# `Restart=on-failure` steht bereits in der Basis-Vorlage
# (familie/familie.service, SVC-3) — dieses Drop-In koppelt nur Fenster und
# Wartezeit auseinander.
#
# Zustand (Stand 2026-08-17): dieses Drop-In liegt im Repo, ist aber noch
# NICHT auf der Maschine ausgerollt (`systemctl show xbuddy-familie -p
# StartLimitIntervalUSec` zeigt weiterhin `10s`). Die Bremse greift, SOBALD
# ausgerollt — nicht vorher. Ausrollen siehe deploy/systemd/README.md,
# Abschnitt „Ausrollen der Neustart-Bremse".
#
# Zweiter Befund (#1801): `familie/familie.service` sagt `Restart=on-failure`,
# Live steht hand-editiert `Restart=always` direkt in der Basis-Unit-Datei
# (nicht über ein Drop-In) — siehe deploy/systemd/README.md, Abschnitt
# „Bekannte Vorlagen-Drift". Dieses Drop-In behebt diese Drift nicht mit,
# macht die Bremse aber unabhängig vom gerade laufenden Restart-Modus wirksam.

[Unit]
StartLimitIntervalSec=120
StartLimitBurst=5
