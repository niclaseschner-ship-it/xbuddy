# systemd Drop-In — Auth-Bot-Token fuer HART-Auth (T1640).
#
# Seit #1640 sind die hoerspiel-Datenrouten (config, alben, resume, themen ...)
# HART-gegatet (auth_gate.make_require_init_data). Der Cookie/tma-Auth-Pfad
# braucht ELTERNCHAT_BOT_TOKEN zum Session-Verify — sonst 500 statt 401/200.
# Die Basis-Instanz zieht den Token ueber ihre Unit; den weiteren Kind-Instanzen
# fehlte er, weil ihre Datenrouten vorher PUBLIC waren.
[Service]
EnvironmentFile=__XBUDDY_DATA__/eltern-chat/.env
