# Per-Instanz-Datenpfade fuer den Eltern-Chat-Bot (SVC-5).
# Setzt EnvironmentFile und ExecStart der Basis-Vorlage zurueck und neu, damit
# .env und Konversations-DB ausserhalb des Checkouts liegen.
[Service]
EnvironmentFile=
EnvironmentFile=__XBUDDY_DATA__/eltern-chat/.env
ExecStart=
ExecStart=__XBUDDY_PYTHON__ main.py --db __XBUDDY_DATA__/eltern-chat/db/conversations.db
