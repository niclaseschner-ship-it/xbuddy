# Neustart-Bremse (#1883, dieselbe Rechnung wie #1801 fuer plan/familie).
#
# DAS PROBLEM, kurz: ohne diese Datei gilt systemds Vorgabewert
# StartLimitIntervalSec=10s. Zusammen mit RestartSec=10s und Burst=5 heisst das:
# das Fenster ist GENAUSO LANG wie die Wartezeit zwischen zwei Neustarts. Es
# koennen nie fuenf Versuche INNERHALB des Fensters liegen — der Zaehler wird
# bei jedem Versuch zurueckgesetzt, die Bremse greift strukturell nie.
#
# "Kein Fenster gesetzt" heisst also NICHT "nicht betroffen", sondern
# "betroffen". Keine der Unit-Vorlagen im Repo setzt eines.
#
# DIE RECHNUNG:
#   RestartSec x StartLimitBurst = 10s x 5 = 50s   (Zeitpunkt des 5. Versuchs)
#   StartLimitIntervalSec = 120s > 50s             (die Bremse kann greifen)
#
# Die 120 sind an plan gemessen, nicht geraten: journalctl vom 2026-08-10 zeigt
# Neustarts im Abstand von rund 10,4s, der Dienst stirbt in derselben Sekunde,
# in der er startet. Der fuenfte Versuch liegt bei etwa 52s — ein 120s-Fenster
# haette dort gegriffen. Die Herleitung steht ausfuehrlich in
# deploy/systemd/xbuddy-plan.service.d/restart-window.conf.
#
# GRENZE DER RECHNUNG: sie unterstellt einen Sofort-Absturz (0s Eigenlaufzeit).
# Der reale Zyklus ist Laufzeit + RestartSec. Bei einem Dienst, der erst nach
# 20s stirbt, waere 120s wieder zu knapp. Fuer die hier beobachteten Faelle
# irrelevant, aber die Rechnung ist notwendig, nicht hinreichend.
#
# Burst bleibt bei 5 und wird hier ausdruecklich gesetzt: der Wert entspricht
# zwar dem systemd-Default, aber die Invariante haengt an ihm — explizit
# gepinnt ist das Drop-In selbsttragend.

[Unit]
StartLimitIntervalSec=120
StartLimitBurst=5
