name: ticket-status-flow

# Automatische Status-Übergänge auf Tickets bei PR-Events.
# Nur Impl-PRs lösen aus (erkannt an "Closes #<nr>" im Body → GitHub
# verlinkt das Issue automatisch als closingIssueReference).
# Spec-PRs nutzen "Refs #" und triggern damit nichts.
#
# Übergänge:
#   PR opened (draft)        → status:in-progress
#   PR opened (ready)        → status:in-review
#   PR converted_to_draft    → status:in-progress
#   PR ready_for_review      → status:in-review
#   PR reopened              → in-progress | in-review (je nach draft)
#   PR closed UNmerged       → status:ready (zurück in Bereitschaft)
#   PR merged                → status:*-Label entfernt (Issue wird durch
#                              "Closes #" auto-closed, status irrelevant)
#
# Siehe WORKFLOW.md — Lebenslauf eines Tickets.

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target status and apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # Target-Status je Event berechnen.
          # Leerer Wert = nichts tun (Spec-PRs landen hier nie, weil sie keine
          # Closes-Referenz haben — siehe unten).
          case "$EVENT_ACTION" in
            opened|reopened|edited)
              # edited: Status neu berechnen, falls der Body von Refs auf Closes
              # wechselt (dann erscheint das Issue jetzt in closingIssuesReferences,
              # unten) — Reconcile-Loch R6.
              if [ "$PR_DRAFT" = "true" ]; then
                TARGET="in-progress"
              else
                TARGET="in-review"
              fi
              ;;
            ready_for_review)
              TARGET="in-review"
              ;;
            converted_to_draft)
              TARGET="in-progress"
              ;;
            closed)
              if [ "$PR_MERGED" = "true" ]; then
                TARGET="__clear__"
              else
                TARGET="ready"
              fi
              ;;
            *)
              TARGET=""
              ;;
          esac

          if [ -z "$TARGET" ]; then
            echo "Kein Status-Übergang für Action=$EVENT_ACTION"
            exit 0
          fi

          # Verlinkte Issues abfragen (nur die, die durch diesen PR
          # geschlossen werden — also "Closes #<nr>"-Referenzen).
          ISSUES=$(gh api graphql -f query='
            query($repo: String!, $owner: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 20) {
                    nodes { number }
                  }
                }
              }
            }' \
            -F owner="${REPO%/*}" \
            -F repo="${REPO#*/}" \
            -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number')

          if [ -z "$ISSUES" ]; then
            echo "Keine Closes-Referenzen — Spec-PR oder Stand-alone-PR. Nichts zu tun."
            exit 0
          fi

          for issue in $ISSUES; do
            # PW-17 (xbuddy-prozess#17, 2026-06-08): Doppelbau-Cleanup-Race
            # — beim closed UNmerged-Übergang darf das Issue NICHT auf ready
            # fallen, wenn noch ein anderer offener Closing-PR existiert
            # (sonst zieht Session A das Ticket weg, während Session B noch
            # arbeitet). Action-getrieben, RECON-3-konform.
            if [ "$TARGET" = "ready" ]; then
              OTHER_OPEN=$(gh api graphql -f query='
                query($o:String!,$n:String!,$num:Int!){
                  repository(owner:$o,name:$n){
                    issue(number:$num){
                      closedByPullRequestsReferences(first:20,includeClosedPrs:false){
                        nodes { number state isDraft }
                      }}}}' \
                -F o="${REPO%/*}" -F n="${REPO#*/}" -F num="$issue" \
                --jq '[.data.repository.issue.closedByPullRequestsReferences.nodes[]
                       |select(.state=="OPEN") |select(.number != '"$PR_NUMBER"')]|length')
              if [ "${OTHER_OPEN:-0}" -ge 1 ]; then
                echo "→ Issue #$issue: SKIP ready-Übergang — $OTHER_OPEN andere(r) offene(r) Closing-PR (Doppelbau-Cleanup-Schutz)."
                continue
              fi
            fi

            echo "→ Issue #$issue: status:$TARGET"

            # NUR die tatsächlich vorhandenen status:*-Label entfernen (RAT-10 fail-loud):
            # ein blindes --remove-label auf ein nicht-vorhandenes Label würde gh-Fehler
            # erzeugen, die wir mit "|| true" früher verschluckt haben (#315-Klasse).
            # PW-17: das "|| true" auf dem Read war Reste-Drift — entfernt; set -e zieht.
            CURRENT=$(gh issue view "$issue" --repo "$REPO" --json labels \
              --jq '.labels|map(.name)|map(select(startswith("status:")))|.[]')
            for label in $CURRENT; do
              gh issue edit "$issue" --repo "$REPO" --remove-label "$label"
            done

            # Beim Merge: Issue läuft per "Closes" leer, kein neues Label nötig.
            if [ "$TARGET" != "__clear__" ]; then
              gh issue edit "$issue" --repo "$REPO" --add-label "status:$TARGET"
            fi

            # Verify-statt-vertrauen (RAT-10): Soll-Zustand zurücklesen, sonst rot.
            AFTER=$(gh issue view "$issue" --repo "$REPO" --json labels \
              --jq '.labels|map(.name)|map(select(startswith("status:")))|join(",")')
            if [ "$TARGET" = "__clear__" ]; then
              [ -z "$AFTER" ] || { echo "::error::#$issue: status-Label hängt nach clear: $AFTER"; exit 1; }
            else
              [ "$AFTER" = "status:$TARGET" ] || { echo "::error::#$issue: erwartet status:$TARGET, ist: ${AFTER:-<leer>}"; exit 1; }
            fi
            echo "  ✓ #$issue status = ${AFTER:-<leer>}"
          done
