name: ruff

# Style-Gate: prüft den repo-weiten Ruff-Lint gegen pyproject.toml
# ([tool.ruff.lint] select/ignore + per-file-ignores). Läuft bei jedem PR.
# Ruff-Version gepinnt (0.15.15) — identisch zum lokalen Selbst-Gate
# `uvx ruff@0.15.15 check`. Kein Autofix im CI: der Lauf meldet nur.
# push:[main] entfernt (RAT-30, Teil 2): der post-merge-main-Lauf wird von
# main-health.yml konsolidiert, damit main nicht dreifach feuert.

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    # Leere Null-Diff-Claim-Flip-PRs überspringen (RAT-34, Amendment RAT-30
    # Teil 3/4). fail-open `!= 0`, NICHT `> 0`: changed_files ist async/lazy
    # (am opened-Event transient null); `!= 0` lässt null/fehlend LAUFEN und
    # nimmt so nie Code aus (RAT-30:36 „Code nie versehentlich ausnehmen").
    if: ${{ github.event.pull_request.changed_files != 0 }}
    runs-on: [self-hosted, win-wsl]
    steps:
      - uses: actions/checkout@v4

      - name: ruff check (repo-weit)
        run: uvx ruff@0.15.15 check
