name: ticket-defaults

# Setzt Default-Label `status:spec` bei jedem neu angelegten Issue.
# Siehe WORKFLOW.md — Lebenslauf eines Tickets.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  set-default-status:
    runs-on: ubuntu-latest
    # Epics (langlebige Initiativen) leben ausserhalb des status:*-Lebenslaufs
    # und duerfen kein Auto-status:spec bekommen. Siehe conventions/epics.md.
    # Greift nur, wenn `epic` schon beim opened-Event gesetzt ist.
    if: ${{ !contains(github.event.issue.labels.*.name, 'epic') }}
    steps:
      - name: Add status:spec label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "status:spec"
