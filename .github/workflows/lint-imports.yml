name: lint-imports

# Architektur-Gate: prüft die Modul-Grenzen (conventions/module-boundaries.md,
# MOD-*) mit import-linter gegen .importlinter. Läuft bei jedem PR.
# Bricht der Lauf ab, ist eine Modul-Grenze verletzt (Zyklus,
# Service↔Service-Python-Import, Zugriff an der zugangsdaten-Public-API vorbei).
# Lokal identisch via `make lint`.
# push:[main] entfernt (RAT-30, Teil 2): der post-merge-main-Lauf wird von
# main-health.yml konsolidiert, damit main nicht dreifach feuert.

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-imports:
    runs-on: [self-hosted, win-wsl]
    steps:
      - uses: actions/checkout@v4

      - name: venv + import-linter installieren
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet "import-linter==2.11.*"

      - name: Modul-Grenzen prüfen
        run: .venv/bin/lint-imports

      - name: MOD-6 — kein sys.path-Insert auf fremdes eltern-chat
        # MOD-6 ergänzt MOD-4 für die Bauzeit-Praxis: import-linter sieht
        # sys.path-Manipulation nicht (statische Imports, Bindestrich-Trick).
        # Zweistufiger Datei-Check: enthält die Datei sys.path-Manipulation
        # UND einen String "eltern-chat"/'eltern-chat' irgendwo? Dann ist
        # sie verdächtig (deckt single/double-quote, augmented assignment
        # `sys.path += [...]`, neutrale Variablen-Namen mit String in
        # vorheriger Zeile). Eltern-chat-Eigen-Inserts (innerhalb
        # eltern-chat/) sind KEIN MOD-4-Bruch und werden übersprungen.
        # Zusätzlich: Petraltete-Allowlist-Check — Allowlist-Einträge ohne
        # aktuellen Match müssen entfernt werden (Sanierungs-Schutz, zwingt
        # Sanierungs-PRs zum gleichzeitigen Allowlist-Update).
        # Siehe conventions/module-boundaries.md MOD-6.
        #
        # T1015 / Cluster-A-Option-B (2026-06-18-1720 watchdog-meta-cluster):
        # Allowlist auf leeren String reduziert. init_data wurde nach
        # tools/initdata/ gehoben, alle Service-main.py + Test-Files importieren
        # jetzt aus tools.initdata statt sys.path-Hack.
        run: |
          set -e
          ALLOWED=""
          BAD=""
          HITS=""
          for f in $(git ls-files '*.py'); do
            case "$f" in eltern-chat/*) continue ;; esac
            if grep -q 'sys\.path\.' "$f" && grep -Eq "['\"]eltern-chat['\"]" "$f"; then
              HITS="$HITS $f"
              echo " $ALLOWED " | grep -q " $f " || BAD="$BAD $f"
            fi
          done
          if [ -n "$BAD" ]; then
            echo "::error::MOD-6 verletzt — sys.path-Insert auf eltern-chat außerhalb Allowlist:"
            for f in $BAD; do echo "  $f"; done
            echo "Siehe conventions/module-boundaries.md MOD-6"
            exit 1
          fi
          STALE=""
          for entry in $ALLOWED; do
            echo " $HITS " | grep -q " $entry " || STALE="$STALE $entry"
          done
          if [ -n "$STALE" ]; then
            echo "::error::MOD-6 Allowlist petraltet — folgende Einträge matchen nicht mehr, bitte entfernen:"
            for e in $STALE; do echo "  $e"; done
            echo "Siehe conventions/module-boundaries.md MOD-6 (Allowlist schmilzt mit Sanierungs-PRs)"
            exit 1
          fi
