name: lint-imports

# Architektur-Gate: prüft die Modul-Grenzen (conventions/module-boundaries.md,
# MOD-*) mit import-linter gegen .importlinter. Läuft bei jedem PR und auf
# main. Bricht der Lauf ab, ist eine Modul-Grenze verletzt (Zyklus,
# Service↔Service-Python-Import, Zugriff an der zugangsdaten-Public-API vorbei).
# Lokal identisch via `make lint`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-imports:
    runs-on: [self-hosted, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: venv + import-linter installieren
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet "import-linter==2.11.*"

      - name: Modul-Grenzen prüfen
        run: .venv/bin/lint-imports
