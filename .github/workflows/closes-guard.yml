name: closes-guard

# ⚠️ Der Job-/Kontextname `closes-guard` IST der required status check im Ruleset
# `main-verriegelung` (id 17352637). NICHT umbenennen / Trigger entfernen ohne das
# Ruleset gleich mitzuziehen — sonst bleibt der Check „Expected" und KEIN PR ist
# mehr mergebar (Brick-main, RAT-10-Risiko R1). Notausgang bei Brick: GitHub →
# Settings → Rules → main-verriegelung auf „Disabled", Fix mergen, wieder „Active".
#
# Required Check (RAT-10 / RECON-2): Ein PR nach `main` muss GENAU EINEN Ausgang
# erfüllen, sonst rot → nicht mergebar:
#   1. Impl-PR:  schließt ein OFFENES, EXISTIERENDES Issue (GitHubs
#                closingIssuesReferences — robuster als Regex, prüft Existenz+offen)
#   2. Spec-PR:  `Refs #<nr>` UND ändert ausschließlich specs/ (oder Label type:docs)
#                → kein Impl-Maskerade über Refs (schließt R3/R6)
#   2b. Prozess-Entscheid-PR: `Refs <owner>/xbuddy-prozess#<nr>` (Cross-Repo, der
#                Treiber lebt im getrennten Prozess-Repo) + Label type:docs
#                (PW-79 RATIFIZIERT 2026-06-30, Nic-Mandat „Ausnahme für Prozess-Tickets")
#   3. Infra:    Label `no-ticket` (bewusst ticketlos, selten)
# Siehe WORKFLOW.md, decisions/RAT-10, conventions/reconcile.md.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  closes-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Ticket-Bezug validieren (offenes Issue / Spec / no-ticket)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          NAME="${REPO#*/}"
          LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels|map(.name)|join(" ")')

          # 3. Bewusste, seltene Infra-Ausnahme (dediziertes Label).
          if printf ' %s ' "$LABELS" | grep -qE ' no-ticket '; then
            echo "✓ Label no-ticket — bewusst ticketlose Infra/Chore erlaubt."
            exit 0
          fi

          # 1. Impl-PR: GitHubs geparste closingIssuesReferences = OFFENE, existierende
          #    Issues, die dieser PR beim Merge schließt. Fängt Fantasie-/geschlossene
          #    Nummern (die tauchen hier nicht auf) und ersetzt die fragile Regex.
          CLOSING=$(gh api graphql -f query='
            query($o:String!,$n:String!,$p:Int!){
              repository(owner:$o,name:$n){
                pullRequest(number:$p){
                  closingIssuesReferences(first:20){ nodes { number state } }
                }}}' \
            -F o="$OWNER" -F n="$NAME" -F p="$PR" \
            --jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[]|select(.state=="OPEN")]|length')
          if [ "${CLOSING:-0}" -ge 1 ]; then
            echo "✓ Impl-PR — schließt $CLOSING offene(s) Issue(s) beim Merge."
            exit 0
          fi

          # 2. Spec-PR: Refs # UND echtes Spec-Signal (nur specs/ geändert ODER type:docs).
          #    Ein Impl-PR kann sich so NICHT über `Refs` an der Reconcile vorbeimogeln.
          BODY=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""')
          if printf '%s' "$BODY" | grep -qiE '(^|[^[:alnum:]])refs:?[[:space:]]+#[0-9]+'; then
            NONSPEC=$(gh pr view "$PR" --repo "$REPO" --json files \
              --jq '.files[].path' | grep -vE '^specs/' | grep -c . || true)
            if [ "${NONSPEC:-0}" -eq 0 ] || printf ' %s ' "$LABELS" | grep -qE ' type:docs '; then
              echo "✓ Spec-PR — Refs + nur specs/ (oder type:docs), kein Close erwartet."
              exit 0
            fi
            echo "::error::'Refs #' gefunden, aber der PR ändert Nicht-specs/-Dateien → das ist ein Impl-PR. Nutze 'Closes #<offenes-issue>' (Auto-Close), nicht 'Refs #'."
            exit 1
          fi

          # 2b. Prozess-Entscheid-PR (PW-79 RATIFIZIERT 2026-06-30, Nic-Mandat
          #     „Ausnahme für Prozess-Tickets"): Eine /berater-runde-Formalisierung
          #     landet methode/-Docs in xbuddy, ihr Treiber ist ein Prozess-Ticket
          #     im STRIKT getrennten Repo xbuddy-prozess (kein xbuddy-Issue zum
          #     Closen). Cross-Repo-Refs `Refs <owner>/xbuddy-prozess#<nr>` + Label
          #     type:docs ist ein gültiger Ausgang. type:docs verhindert Impl-
          #     Maskerade — Code-PRs tragen es nicht.
          if printf '%s' "$BODY" | grep -qiE '(^|[^[:alnum:]])refs:?[[:space:]]+[A-Za-z0-9_.-]+/xbuddy-prozess#[0-9]+'; then
            if printf ' %s ' "$LABELS" | grep -qE ' type:docs '; then
              echo "✓ Prozess-Entscheid-PR — Refs xbuddy-prozess#<nr> + type:docs, kein Close erwartet."
              exit 0
            fi
            echo "::error::Refs auf xbuddy-prozess gefunden, aber Label type:docs fehlt → Prozess-Entscheid-PRs brauchen type:docs."
            exit 1
          fi

          echo "::error::closes-guard: kein gültiger Ausgang. Impl-PR: 'Closes #<offenes-issue>' · Spec-PR (nur specs/): 'Refs #<nr>' · Prozess-Entscheid: 'Refs <owner>/xbuddy-prozess#<nr>' + type:docs · bewusst ticketlose Infra: Label 'no-ticket'."
          exit 1
