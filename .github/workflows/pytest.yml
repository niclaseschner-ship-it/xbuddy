name: pytest

# Test-Gate: fährt die repo-weite pytest-Suite (pytest.ini/testpaths). Läuft
# bei jedem PR. Bricht der Lauf ab, ist ein Test rot oder eine
# Suite hat einen Collect-Fehler. Lokal identisch via `make test` (Makefile).
# KEIN -k/Modul-/testpaths-Filter — die Suite bleibt repo-weit (RAT-30, Teil 3;
# Codex-BRICHT: pytest.ini Cross-Suite-Import-Kollision, Einzelsuiten grün ⇒
# Gesamtlauf kann rot sein).
# push:[main] entfernt (RAT-30, Teil 2): der post-merge-main-Lauf wird von
# main-health.yml konsolidiert.
#
# Der Guard tests/test_testpaths_vollstaendig.py hält testpaths gegen die
# Realität — eine neu angelegte Suite, die nicht in pytest.ini steht, lässt
# diesen Job rot werden (T1310, gegen unsichtbar-nicht-gelaufene Tests).

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Leere Null-Diff-Claim-Flip-PRs überspringen (RAT-34, Amendment RAT-30
    # Teil 3/4). fail-open `!= 0`, NICHT `> 0`: changed_files ist async/lazy
    # (am opened-Event transient null); `!= 0` lässt null/fehlend LAUFEN und
    # nimmt so nie Code aus (RAT-30:36 „Code nie versehentlich ausnehmen").
    if: ${{ github.event.pull_request.changed_files != 0 }}
    # Schwere Compute-Jobs (pytest/ruff/lint-imports/main-health) laufen
    # EXKLUSIV auf dem Windows-Runner win-wsl-buddy, damit der Pi (Kiosk +
    # Services + Kommandobrücke-Sessions) CI-frei bleibt.
    # FALLBACK bei Windows aus: schweren 4 Workflows das `, win-wsl` entfernen
    # → `runs-on: [self-hosted]` → der (geleinte) Pi übernimmt, null Quote.
    runs-on: [self-hosted, win-wsl]
    steps:
      - uses: actions/checkout@v4

      - name: pip-Cache (RAT-30, Teil 3)
        # Cacht den pip-Download-Ordner; Key aus dem Hash der pyproject.toml
        # (der EINEN Dependency-SSoT, RAT-33/#1534), damit ein Dep-Diff den
        # Cache invalidiert. Spart den Netz-Roundtrip der Wheels auf dem einen
        # Pi-Runner.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-pytest-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-pytest-

      - name: venv + Test-Abhängigkeiten (pyproject-SSoT)
        # Install AUSSCHLIESSLICH aus pyproject.toml (RAT-33 Option A, #1534):
        # KEIN --system-site-packages mehr — das isolierte venv erzwingt, dass
        # [project.dependencies] vollständig ist (jeder fehlende direkte Dep
        # macht diesen Job rot, statt still über globale Pakete kaschiert zu
        # werden — genau die #1515-Klasse). pytest ist Test-, kein Runtime-Dep
        # und wird separat installiert.
        run: |
          python3 -m venv .venv-pytest
          .venv-pytest/bin/pip install --quiet .
          .venv-pytest/bin/pip install --quiet pytest

      - name: pytest (repo-weit)
        run: .venv-pytest/bin/python -m pytest -q
