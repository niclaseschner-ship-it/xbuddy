name: Feature
description: Ein Feature als Inkrement gegen die Spec
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: >
        Ein Feature setzt Anforderungen aus den `specs/` um. Reihenfolge:
        erst die betroffene Komponenten-Spec schärfen (Requirement-IDs
        vergeben/ändern, reviewen) — dann implementieren.
  - type: textarea
    id: summary
    attributes:
      label: Worum geht es?
      description: Ein, zwei Sätze — was soll XBuddy können, das es heute nicht kann?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Warum / North-Star-Bezug
      description: >
        Verschiebt es eine Aufgabe vom Elternteil zum Kind, oder lässt es
        XBuddy mit der Familie mitwachsen?
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Betroffene Spec
      description: "Welche Datei in specs/? z. B. specs/buddies/kalender.md"
      placeholder: specs/<komponente>.md
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirement-IDs
      description: >
        Welche Anforderungs-IDs setzt dieses Ticket um? Bestehende IDs
        nennen oder neue Kurztitel — die IDs werden in der Spec vergeben.
      value: |
        -
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Ökosystem-Baustein
      description: Bitte danach auch das passende `area:`-Label setzen.
      options:
        - Display
        - Controller
        - Hub
        - Buddy
        - Infra / übergreifend
    validations:
      required: true
  - type: checkboxes
    id: spec-checkpoint
    attributes:
      label: Spec-Checkpoint
      description: Vor dem Wechsel auf „In Progress" abhaken — kein Code davor.
      options:
        - label: Die Requirement-IDs stehen in der Komponenten-Spec und sind reviewt.
  - type: textarea
    id: notes
    attributes:
      label: Notizen / offene Fragen
    validations:
      required: false
