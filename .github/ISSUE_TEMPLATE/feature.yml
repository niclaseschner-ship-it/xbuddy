name: Feature
description: Ein Feature als Inkrement gegen die Spec
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: >
        Ein Feature setzt Anforderungen aus den `specs/` um. Reihenfolge:
        erst die betroffene Komponenten-Spec schärfen (Requirement-IDs
        vergeben/ändern, reviewen) — dann implementieren.


        Die ersten vier Felder sind die **Default-Struktur** jedes Tickets
        (Treiber · Problem · Lösung · Risiko) — sie machen das Ticket schnell
        entscheidbar und sind die Grundlage fürs Handoff an `/arbeitstag`.
  - type: textarea
    id: treiber
    attributes:
      label: Treiber / Schmerz
      description: >
        Warum gibt es dieses Ticket? Welcher konkrete Schmerz, für wen
        (Kind / Elternteil)? North-Star-Bezug: verschiebt es eine Aufgabe vom
        Elternteil zum Kind, oder lässt es XBuddy mit der Familie mitwachsen?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Was kann XBuddy heute nicht, das es können soll? Der Ist-Zustand, der stört.
    validations:
      required: true
  - type: textarea
    id: loesung
    attributes:
      label: Lösung
      description: Wie soll es gelöst werden? Der angedachte Weg — Grobentwurf genügt, die Spec schärft die Details.
    validations:
      required: true
  - type: textarea
    id: risiko
    attributes:
      label: Risiko / Herausforderung
      description: Was ist offen, riskant oder schwer? Wo könnte es brechen, was muss geklärt werden?
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Betroffene Spec
      description: "Welche Datei in specs/? z. B. specs/buddies/kalender.md"
      placeholder: specs/<komponente>.md
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirement-IDs
      description: >
        Welche Anforderungs-IDs setzt dieses Ticket um? Bestehende IDs
        nennen oder neue Kurztitel — die IDs werden in der Spec vergeben.
      value: |
        -
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Ökosystem-Baustein
      description: Bitte danach auch das passende `area:`-Label setzen.
      options:
        - Display
        - Controller
        - Hub
        - Buddy
        - Infra / übergreifend
    validations:
      required: true
  - type: input
    id: kosten
    attributes:
      label: Kosten / Aufwand
      description: "Optional, soweit absehbar: grobe Größe / Aufwand / laufende Kosten (z. B. API-Calls)."
    validations:
      required: false
  - type: checkboxes
    id: spec-checkpoint
    attributes:
      label: Spec-Checkpoint
      description: Vor dem Wechsel auf „In Progress" abhaken — kein Code davor.
      options:
        - label: Die Requirement-IDs stehen in der Komponenten-Spec und sind reviewt.
  - type: textarea
    id: notes
    attributes:
      label: Notizen / offene Fragen
    validations:
      required: false
