<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>XBuddy Display</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- DC-11 — PWA-Manifest deklariert `display: fullscreen`. Wird der
     Client als App auf dem Display-Gerät installiert, startet er ohne
     Browser-Chrome. Im normalen Tab ohne Installation greifen
     requestFullscreen() + Wake-Lock (siehe unten). -->
<link rel="manifest" href="./manifest.json">
<!-- DC-11 — Icon-Tags für Browser-Tab und Android-Install-Flow -->
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<style>
  /* DC-5 — Ruhe-Zustand: vollständig schwarze Fläche (#000000, Constitution:
     nicht-invasiv, verschwindet visuell aus dem Raum). Im Ruhe-Zustand ist
     #scaler versteckt (hidden/display:none), sodass nur html/body sichtbar
     ist — dieser bleibt permanent schwarz. Letterbox/Pillarbox (nur im
     View-Zustand sichtbar, wenn #scaler nicht hidden) trägt die Standard-
     Hintergrundfarbe #F5F1E8 (#scaler background) — ENTKOPPELT von DC-5. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; overflow: hidden; }

  /* DC-12 / DC-13 — Adapter-Container: zentriert das skalierte iframe,
     trägt selbst keine UI. Flexbox-Zentrierung verteilt verbleibenden
     Raum (Letterbox/Pillarbox) symmetrisch. Hintergrundfarbe #F5F1E8
     (Standard-BG, --bg) greift als Letterbox-Farbe nur im View-Zustand;
     im Ruhe-Zustand ist #scaler versteckt, sodass DC-5 (html/body #000000)
     unberührt bleibt. */
  #scaler { position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center; background: #F5F1E8; }
  #scaler[hidden] { display: none; }

  /* DC-12 / DC-15 — iframe in fester Design-Auflösung 1920×1080.
     `transform: scale(s)` (von displib.applyScale gesetzt) passt es
     proportional ins Viewport ein; `transform-origin: center`
     skaliert um den Mittelpunkt des iframe-Layouts, damit die
     Letterbox/Pillarbox symmetrisch verteilt ist — die Zentrierung
     übernimmt der Flex-Container. */
  #content { width: 1920px; height: 1080px; border: 0; flex: none;
    background: #000000; transform-origin: center; }

  /* DC-8 — Einrichtungs-Hinweis: lesbar, nicht der schwarze Ruhe-Zustand,
     keine kaputte Seite. Richtet sich an die Person, die das Display
     einrichtet. */
  #setup { position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 0.7em; box-sizing: border-box; padding: 8vh 8vw;
    background: #1b2330; color: #e8eef7; text-align: center;
    font-family: system-ui, -apple-system, sans-serif; }
  #setup.show { display: flex; }
  #setup h1 { margin: 0; font-weight: 600; font-size: clamp(20px, 4vw, 40px); }
  #setup p { margin: 0; max-width: 32em; line-height: 1.5;
    color: #aab8cc; font-size: clamp(14px, 2.4vw, 22px); }
</style>
</head>
<body>
  <!-- DC-12 — Skalierungs-Container + iframe. Hidden im Ruhe-Zustand;
       sichtbar, sobald der Stream einen Inhalt liefert.
       DC-17 — allow="microphone; autoplay": Feature-Policy für Buddy-
       Apps im iframe (KIBuddy Push-to-Talk braucht getUserMedia,
       TTS-Wiedergabe braucht Autoplay ohne separate User-Geste). -->
  <div id="scaler" hidden>
    <iframe id="content" allow="microphone; autoplay"></iframe>
  </div>
  <div id="setup">
    <h1>Dieses Anzeigegerät ist noch nicht eingerichtet</h1>
    <p id="setup-msg"></p>
  </div>

  <!-- DC-16 — Service-Worker-Registrierung für WebAPK-Install-Pfad.
       Registrierung am Seiten-Load; scope './' damit der SW den
       Display-Client-Pfad (/display/<id>/) abdeckt. -->
  <script>
    if ('serviceWorker' in navigator) {
      // #1455 — klebenden alten SW beim nächsten Load zwangs-ersetzen; Cookie
      // bleibt (separater Speicher). updateViaCache:'none' + update() ziehen die
      // neue sw.js sofort; controllerchange lädt beim SW-Wechsel EINMAL neu.
      var __hadController = !!navigator.serviceWorker.controller;
      var __reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!__hadController || __reloaded) return;
        __reloaded = true;
        window.location.reload();
      });
      navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
        .then(function (reg) { reg.update(); })
        .catch(function (err) {
          console.warn('SW-Registrierung fehlgeschlagen (DC-16):', err);
        });
    }
  </script>
  <script src="displib.js"></script>
  <script>
    (function () {
      'use strict';
      var scaler   = document.getElementById('scaler');
      var iframe   = document.getElementById('content');
      var setup    = document.getElementById('setup');
      var setupMsg = document.getElementById('setup-msg');

      // DC-18 — Viewport-Fit-Guard: trackt den aktuellen Fit-Modus.
      // Wird in showContent() aus der Content-URL gesetzt; rescale() liest
      // ihn bei jedem Aufruf (resize, orientationchange, showContent).
      var fitViewport = false;

      // DC-14 / DC-18 — Re-Skalierung bei Viewport-Änderung.
      // ?fit=viewport (DC-18): iframe 100%×100%, transform:none, kein
      //   applyScale — Inhalt ist selbst fluid (responsive CSS).
      // Default (fixed, DC-12/DC-15): applyScale wie bisher (Letterbox).
      function rescale() {
        if (fitViewport) {
          scaler.style.display   = 'block';
          iframe.style.width     = '100%';
          iframe.style.height    = '100%';
          iframe.style.transform = 'none';
          return;
        }
        // Restore für fixed-Pfad (auch bei Wechsel viewport-fit → fixed)
        scaler.style.display   = '';
        iframe.style.width     = '';
        iframe.style.height    = '';
        iframe.style.transform = '';
        dispLib.applyScale(iframe, window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', rescale);
      window.addEventListener('orientationchange', rescale);
      rescale();   // initial — auch wenn iframe noch hidden ist

      // View — die DOM-Seite des Clients. dispLib ruft genau diese drei
      // Methoden; getestet wird die Logik gegen eine Doppelung (DC-10).
      var view = {
        // DC-3 / DC-4 / DC-12 / DC-18 — gerouteten Inhalt im iframe zeigen.
        // Erkennt ?fit=viewport an der Content-URL (DC-18) und schaltet
        // rescale() in den Viewport-Fit-Modus. dispLib ruft das nur bei
        // echtem Wechsel (Dedup liegt dort).
        showContent: function (url) {
          setup.classList.remove('show');
          // DC-18: ?fit=viewport-Erkennung in der Content-URL
          try {
            fitViewport = new URL(url, location.origin).searchParams.get('fit') === 'viewport';
          } catch (_) {
            fitViewport = /[?&]fit=viewport(?:[&#]|$)/.test(url);
          }
          iframe.src = url;
          scaler.hidden = false;
          rescale();
        },
        // DC-5 — schwarzer Ruhe-Zustand. iframe leeren, damit der vorige
        // Inhalt nicht weiterlebt (Audio, JS).
        showIdle: function () {
          setup.classList.remove('show');
          scaler.hidden = true;
          iframe.removeAttribute('src');
        },
        // DC-8 — Einrichtungs-Hinweis, nennt die display_id soweit vorhanden.
        showSetup: function (displayId) {
          scaler.hidden = true;
          setupMsg.textContent = displayId
            ? 'Der Router kennt die Display-Kennung „' + displayId + '“ nicht. '
              + 'Prüfe die Einstiegs-URL des Geräts oder lege das Display im Router an.'
            : 'Diesem Gerät ist keine Display-Kennung zugeordnet. '
              + 'Richte den Browser dauerhaft auf eine /display/<id>-URL.';
          setup.classList.add('show');
        }
      };

      // DC-11 — Bildschirm wach halten + Vollbild beim ersten Gesture.
      // Pattern aus FIG-26 (controller/figuren-erkennung). Beide Hooks sind
      // no-op-fähig: fehlt die API, läuft der Client einfach ohne weiter.
      //
      // DC-11 embedded-Ausnahme (SHELL-11): eingebettet in Heim-Shell-Iframe
      // (window.self !== window.top) → kein DC-Eigen-Vollbild anhängen.
      // Die Shell besitzt den Vollbild (SHELL-11); standalone Display-Geräte
      // (window.self === window.top) behalten DC-11 unverändert.
      dispLib.attachWakeLock(document, navigator);
      if (window.self === window.top) {
        dispLib.attachFullscreenOnGesture(document);
      }

      // DC-9 — keine Konfiguration: die Identität ergibt sich aus der URL,
      // die Router-Herkunft aus derselben Origin, das Reconnect-Verhalten
      // aus dem SSE-Standard.
      dispLib.createClient({
        pathname: location.pathname,
        view: view,
        EventSourceImpl: window.EventSource
      });

      // OQ-1 — Kiosk Rolling-Refresh-Heartbeat (auth.md AUTH-2 Rolling-Refresh).
      // Der Kiosk laeuft im Dauerbetrieb (24/7). Die SSE-Verbindung ist eine
      // einzige HTTP-Antwort — nach dem initialen Set-Cookie erfolgt kein
      // erneuter Rolling-Refresh ueber den Stream. Ohne periodischen Request
      // koennte der xbuddy_session-Cookie nach 90 Tagen ablaufen und der Kiosk
      // sieht die AUTH-8-Seite (silent break ueber Nacht).
      //
      // Mechanik: einmal taeglich (86 400 000 ms = 24 h) wird ein HEAD-Request
      // an die eigene Display-Client-Route (/display/<display_id>/) geschickt.
      // Diese Route traegt require_dual_gate(mode='observe') — bei validem Cookie
      // setzt der Decorator ein frisches Set-Cookie (Rolling-Refresh, AUTH-2:78).
      // Der HEAD-Request ist no-op fuer den Server (kein Body), aber die Antwort
      // traegt den neuen Set-Cookie-Header, den der Browser uebernimmt.
      //
      // Keine neue Route noetig — der bestehende authentifizierte Traffic reicht.
      // Fehlt die Fetch-API (sehr alter Browser) oder scheitert der Request, ist
      // das kein Fehler: der Kiosk laeuft weiter, nur ohne Cookie-Auffrischung.
      (function startHeartbeat() {
        var HEARTBEAT_MS = 86400000; // 24 Stunden
        function ping() {
          try {
            fetch(location.href, { method: 'HEAD', credentials: 'same-origin' })
              .catch(function () {}); // best-effort, kein UI-Bruch bei Netzfehler
          } catch (e) { /* Fetch-API nicht verfuegbar */ }
        }
        if (typeof fetch !== 'undefined') {
          setInterval(ping, HEARTBEAT_MS);
        }
      })();
    })();
  </script>
</body>
</html>
